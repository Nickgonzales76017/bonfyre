name: Setup Bonfyre
description: >-
  Build the Bonfyre fabric and selected cmd/Bonfyre* binaries, initialise a
  fabric state directory, and put the binaries on PATH.

inputs:
  commands:
    description: >-
      Space-separated cmd/Bonfyre* directory names to build, e.g.
      "BonfyreCanon BonfyreQueue". Empty builds none.
    required: false
    default: ""
  fabric:
    description: Initialise a fabric state directory and export BONFYRE_STATE_DIR.
    required: false
    default: "true"
  fuse:
    description: Install FUSE and build BonfyreFS. Linux runners only.
    required: false
    default: "false"

outputs:
  state-dir:
    description: The initialised BONFYRE_STATE_DIR, empty when fabric is false.
    value: ${{ steps.fabric.outputs.state-dir }}

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        set -euo pipefail
        packages="libsqlite3-dev pkg-config"
        if [ "${{ inputs.fuse }}" = "true" ]; then
          packages="$packages libfuse-dev fuse"
        fi
        if command -v apt-get >/dev/null 2>&1; then
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $packages
        else
          echo "::notice::non-apt runner; assuming dependencies are present"
        fi

    - uses: mlugg/setup-zig@v1
      with:
        version: 0.13.0

    - name: Build the fabric
      shell: bash
      run: zig build

    - name: Build requested commands
      shell: bash
      run: |
        set -euo pipefail
        commands="${{ inputs.commands }}"
        if [ "${{ inputs.fuse }}" = "true" ]; then
          commands="$commands BonfyreFS"
        fi
        [ -n "${commands// /}" ] || { echo "no commands requested"; exit 0; }
        mkdir -p "$RUNNER_TEMP/bonfyre-bin"
        for name in $commands; do
          dir="cmd/$name"
          [ -d "$dir" ] || { echo "::error::no such command: $name"; exit 1; }
          make -C "$dir"
          # Each command builds a single lowercased binary next to its Makefile.
          found=$(find "$dir" -maxdepth 1 -type f -perm -u+x ! -name '*.o' ! -name 'Makefile' | head -1)
          [ -n "$found" ] || { echo "::error::$name produced no binary"; exit 1; }
          cp "$found" "$RUNNER_TEMP/bonfyre-bin/"
        done
        echo "$RUNNER_TEMP/bonfyre-bin" >> "$GITHUB_PATH"
        echo "$PWD/zig-out/bin" >> "$GITHUB_PATH"

    - name: Initialise fabric
      id: fabric
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.fabric }}" != "true" ]; then
          echo "state-dir=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        state="$RUNNER_TEMP/bonfyre-fabric"
        mkdir -p "$state"
        echo "BONFYRE_STATE_DIR=$state" >> "$GITHUB_ENV"
        BONFYRE_STATE_DIR="$state" ./zig-out/bin/bonfyre fabric init
        echo "state-dir=$state" >> "$GITHUB_OUTPUT"
