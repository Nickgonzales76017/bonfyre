name: Native ratchet

# The JS/script estate may only shrink toward C over YAFF/CUE. Budgets live in
# architecture/native-ratchet.cue and are lowered by `native-ratchet.sh tighten`
# after each port. Plan: docs/engineering/mjs-retirement-20261022/PLAN.md

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.17.1
      - name: Check the native ratchet
        run: sh scripts/native-ratchet.sh check
      - name: Native toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev zlib1g-dev sqlite3 >/dev/null
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: libbonfyre JS-compatible primitives (JSON.stringify, RegExp parity)
        run: |
          make -C lib/libbonfyre
          sh lib/libbonfyre/tests/bf_jsonw_parity.sh
          sh lib/libbonfyre/tests/bf_re_parity.sh
      - name: bonfyre-operator golden vectors
        run: make -C cmd/BonfyreOperator test parity

  # Decide's golden vectors were recorded on macOS arm64 and pass there. On
  # the x86_64 Linux runner three of 47 differ by 1-2 bytes in 20-360 KB
  # reports (floating-point output, cause not yet isolated), so byte parity
  # runs on the platform that recorded the vectors.
  decide-parity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.17.1
      - name: bonfyre-decide (books, monitor, manifest) golden vectors
        run: |
          make -C lib/libbonfyre
          bash cmd/BonfyreDecide/tests/parity.sh
