name: REA Mac workstation proof
on:
  pull_request:
    paths:
      - 'scripts/rea-local.sh'
      - 'Aurekai/native/creator/**'
      - 'Aurekai/tests/creator-native-mix.test.mjs'
      - '.github/workflows/rea-mac-local.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/rea-local.sh'
      - 'Aurekai/native/creator/**'
      - 'Aurekai/tests/creator-native-mix.test.mjs'
      - '.github/workflows/rea-mac-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-isolated-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Validate isolated installer
        run: |
          bash -n scripts/rea-local.sh
          bash scripts/rea-local.sh help
      - name: Install real REA release into a disposable Mac home
        run: |
          set -eu
          echo "BONFYRE_REA_ROOT=$RUNNER_TEMP/bonfyre-rea-local" >> "$GITHUB_ENV"
          export BONFYRE_REA_ROOT="$RUNNER_TEMP/bonfyre-rea-local"
          bash scripts/rea-local.sh install
          bash scripts/rea-local.sh install
          test -f "$BONFYRE_REA_ROOT/releases/6.4.0/node_modules/rea-agents/scripts/rea.mjs"
          test -d "$BONFYRE_REA_ROOT/npm-cache"
      - name: Prove portable private Node bootstrap on a real Mac
        run: |
          set -eu
          export BONFYRE_REA_ROOT="$RUNNER_TEMP/rea-private-node-regression"
          export BONFYRE_REA_FORCE_PRIVATE_NODE=1
          bash scripts/rea-local.sh install
          test -x "$BONFYRE_REA_ROOT/toolchains/node-v24.11.0/bin/node"
          test ! -L "$BONFYRE_REA_ROOT/toolchains/node-v24.11.0"
          bash scripts/rea-local.sh smoke
          bash scripts/rea-local.sh install
          test "$("$BONFYRE_REA_ROOT/toolchains/node-v24.11.0/bin/node" --version)" = v24.11.0
      - name: Reproduce macOS Node-without-adjacent-npm layout
        run: |
          set -eu
          # Simulate the actual user failure: a supported Node executable
          # available on PATH with no colocated lib/node_modules/npm. Do not
          # use FORCE_PRIVATE here; the installer must detect and heal it.
          bare="$RUNNER_TEMP/rea-node-without-npm"
          mkdir -p "$bare/bin"
          cp "$(command -v node)" "$bare/bin/node"
          test -x "$bare/bin/node"
          test ! -f "$bare/lib/node_modules/npm/bin/npm-cli.js"
          export PATH="$bare/bin:$PATH"
          export BONFYRE_REA_ROOT="$RUNNER_TEMP/rea-missing-npm-regression"
          unset BONFYRE_REA_FORCE_PRIVATE_NODE BONFYRE_REA_NODE_BIN || true
          bash scripts/rea-local.sh install
          test -x "$BONFYRE_REA_ROOT/toolchains/node-v24.11.0/bin/node"
          test -f "$BONFYRE_REA_ROOT/releases/6.4.0/node_modules/rea-agents/scripts/rea.mjs"
          bash scripts/rea-local.sh smoke
          bash scripts/rea-local.sh install
      - name: Inspect synthetic JavaScript locally through actual REA
        run: bash scripts/rea-local.sh smoke
      - name: Verify compact local REA doctor projection
        run: |
          set -eu
          result="$(bash scripts/rea-local.sh doctor)"
          printf '%s\n' "$result"
          REA_DOCTOR_RESULT="$result" node --input-type=module <<'JS'
          const report=JSON.parse(process.env.REA_DOCTOR_RESULT);
          if(report.schema!=='bonfyre.rea.local-doctor.v1'||report.package_version!=='6.4.0')
            throw Error('REA compact doctor lacks verified identity');
          if(!Array.isArray(report.native_providers)||!Array.isArray(report.agent_registrations))
            throw Error('REA compact doctor lost provider/registration availability');
          if(Buffer.byteLength(process.env.REA_DOCTOR_RESULT)>32768)
            throw Error('REA doctor returned an unbounded catalog instead of status');
          JS
      - name: Discover explicit versioned creative app targets without opening them
        run: |
          set -eu
          fixture="$RUNNER_TEMP/rea-creative-targets"
          mkdir -p "$fixture/Ableton Live 99 Suite.app" "$fixture/FL Studio 99.app"
          mkdir -p "$fixture/Adobe/Adobe After Effects 99.app" "$fixture/Personal Notes.app"
          mkdir -p "$fixture/Obsidian.app/Contents/Frameworks/Obsidian Helper (GPU).app"
          observed="$(BONFYRE_REA_APP_ROOT="$fixture" bash scripts/rea-local.sh targets)"
          echo "$observed"
          case "$observed" in *"Ableton Live 99 Suite.app"*) ;; *) exit 1 ;; esac
          case "$observed" in *"FL Studio 99.app"*) ;; *) exit 1 ;; esac
          case "$observed" in *"Adobe After Effects 99.app"*) ;; *) exit 1 ;; esac
          case "$observed" in *"Personal Notes.app"*) exit 1 ;; esac
          case "$observed" in *"Obsidian"*) exit 1 ;; esac
          test "$(printf '%s\n' "$observed" | grep -c '^available ')" -eq 3
      - name: Verify no-Ghidra REA on a real Creator Mach-O
        run: |
          set -eu
          sandbox="$RUNNER_TEMP/rea-creator-native-fastpath"
          mkdir -p "$sandbox"
          cc -O2 -std=c11 -ffp-contract=off \
            Aurekai/native/creator/mix.c Aurekai/native/creator/mix_kernel.c \
            -lm -o "$sandbox/creator-mix"
          bash scripts/rea-local.sh native-map "$sandbox/creator-mix" > "$sandbox/map.json"
          node - "$sandbox/map.json" <<'JS'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.schema!=='bonfyre.rea.native-map.v1'||
             !r.evidence_id?.startsWith('ev_')||
             !/^[a-f0-9]{64}$/.test(r.target_sha256??'')||
             !Number.isInteger(r.image_count)||!Number.isInteger(r.dependency_edge_count)||
             r.state!=='static_native_observation_not_runtime_proof')process.exit(1);
          console.log(JSON.stringify(r));
          JS
      - name: Verify user-selected external native root preflight
        run: |
          set -eu
          mount="$RUNNER_TEMP/rea native tools"
          mkdir -p "$mount"
          BONFYRE_REA_NATIVE_ROOT="$mount" bash scripts/rea-local.sh native-preflight > "$RUNNER_TEMP/native-preflight.json"
          node - "$RUNNER_TEMP/native-preflight.json" "$mount" <<'JS'
          const fs=require('node:fs');
          const v=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(v.schema!=='bonfyre.rea.native-preflight.v1'||
             v.native_root!==process.argv[3]||
             v.state!=='read_only_preflight_no_downloads')process.exit(1);
          console.log(JSON.stringify(v));
          JS
          if BONFYRE_REA_NATIVE_ROOT="$RUNNER_TEMP/unmounted target" bash scripts/rea-local.sh native-preflight; then
            echo 'Missing native root was incorrectly accepted' >&2
            exit 1
          fi
      - name: Verify native float32 composer on real macOS runner
        run: node --test Aurekai/tests/creator-native-mix.test.mjs
      - name: Check optional provider and external application discovery
        run: |
          bash scripts/rea-local.sh targets
          bash scripts/rea-local.sh rea providers --json
          bash scripts/rea-local.sh setup-preview
      - name: Register REA in disposable Codex and Claude Code profiles
        run: |
          set -eu
          # Explicitly isolate users' real agent configurations and credentials.
          export HOME="$RUNNER_TEMP/rea-agents-home"
          mkdir -p "$HOME"
          export BONFYRE_REA_ROOT="$RUNNER_TEMP/rea-private-node-regression"
          export BONFYRE_REA_FORCE_PRIVATE_NODE=1
          test -x "$BONFYRE_REA_ROOT/toolchains/node-v24.11.0/bin/node"
          bash scripts/rea-local.sh agents-preview > "$RUNNER_TEMP/rea-agents-plan.json"
          bash scripts/rea-local.sh agents-connect > "$RUNNER_TEMP/rea-agents-applied.json"
          test -f "$HOME/.codex/config.toml"
          test -f "$HOME/.claude.json"
          grep -qi rea "$HOME/.codex/config.toml"
          grep -qi rea "$HOME/.claude.json"
          # POSIX upstream REA registers the absolute JS entrypoint, which
          # uses /usr/bin/env node. Its doctor-compatible format is deliberate;
          # agents-connect refuses if the host PATH cannot launch REA.
          entry="$BONFYRE_REA_ROOT/releases/6.4.0/node_modules/rea-agents/scripts/rea.mjs"
          grep -Fq "$entry" "$HOME/.codex/config.toml"
          grep -Fq "$entry" "$HOME/.claude.json"
          node - <<'JS'
          const fs=require('node:fs'), path=require('node:path');
          const root=process.env.RUNNER_TEMP;
          const installed=JSON.parse(fs.readFileSync(path.join(root,'rea-agents-applied.json'),'utf8'));
          console.log(JSON.stringify({setup_status:installed.status,
            applied_actions:installed.appliedActions?.length??null,
            target_scope:'disposable codex+claude only'}));
          JS
          bash scripts/rea-local.sh rea doctor --client codex --json > "$RUNNER_TEMP/rea-agent-codex-health.json"
          bash scripts/rea-local.sh rea doctor --client claude_code --json > "$RUNNER_TEMP/rea-agent-claude-health.json"
          echo "REA scoped agent registrations verified without touching real Mac accounts"
      - name: Verify no scanned estate or global npm artifact
        run: |
          set -eu
          test -d "$BONFYRE_REA_ROOT/releases/6.4.0"
          test ! -e "$HOME/.bonfyre/rea"
          test ! -e "$HOME/.config/rea/bonfyre-client.json"
