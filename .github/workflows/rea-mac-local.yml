name: REA Mac workstation proof
on:
  pull_request:
    paths:
      - 'scripts/rea-local.sh'
      - 'Aurekai/native/creator/**'
      - 'Aurekai/tests/creator-native-mix.test.mjs'
      - '.github/workflows/rea-mac-local.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/rea-local.sh'
      - 'Aurekai/native/creator/**'
      - 'Aurekai/tests/creator-native-mix.test.mjs'
      - '.github/workflows/rea-mac-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-isolated-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Validate isolated installer
        run: |
          bash -n scripts/rea-local.sh
          bash scripts/rea-local.sh help
      - name: Install real REA release into a disposable Mac home
        run: |
          set -eu
          echo "BONFYRE_REA_ROOT=$RUNNER_TEMP/bonfyre-rea-local" >> "$GITHUB_ENV"
          export BONFYRE_REA_ROOT="$RUNNER_TEMP/bonfyre-rea-local"
          bash scripts/rea-local.sh install
          bash scripts/rea-local.sh install
          test -f "$BONFYRE_REA_ROOT/releases/6.4.0/node_modules/rea-agents/scripts/rea.mjs"
          test -d "$BONFYRE_REA_ROOT/npm-cache"
      - name: Prove portable private Node bootstrap on a real Mac
        run: |
          set -eu
          export BONFYRE_REA_ROOT="$RUNNER_TEMP/rea-private-node-regression"
          export BONFYRE_REA_FORCE_PRIVATE_NODE=1
          bash scripts/rea-local.sh install
          test -x "$BONFYRE_REA_ROOT/toolchains/node-v24.11.0/bin/node"
          test ! -L "$BONFYRE_REA_ROOT/toolchains/node-v24.11.0"
          bash scripts/rea-local.sh smoke
          bash scripts/rea-local.sh install
          test "$("$BONFYRE_REA_ROOT/toolchains/node-v24.11.0/bin/node" --version)" = v24.11.0
      - name: Inspect synthetic JavaScript locally through actual REA
        run: bash scripts/rea-local.sh smoke
      - name: Discover explicit versioned creative app targets without opening them
        run: |
          set -eu
          fixture="$RUNNER_TEMP/rea-creative-targets"
          mkdir -p "$fixture/Ableton Live 99 Suite.app" "$fixture/FL Studio 99.app"
          mkdir -p "$fixture/Adobe/Adobe After Effects 99.app" "$fixture/Personal Notes.app"
          observed="$(BONFYRE_REA_APP_ROOT="$fixture" bash scripts/rea-local.sh targets)"
          echo "$observed"
          case "$observed" in *"Ableton Live 99 Suite.app"*) ;; *) exit 1 ;; esac
          case "$observed" in *"FL Studio 99.app"*) ;; *) exit 1 ;; esac
          case "$observed" in *"Adobe After Effects 99.app"*) ;; *) exit 1 ;; esac
          case "$observed" in *"Personal Notes.app"*) exit 1 ;; esac
          test "$(printf '%s\n' "$observed" | grep -c '^available ')" -eq 3
      - name: Verify native float32 composer on real macOS runner
        run: node --test Aurekai/tests/creator-native-mix.test.mjs
      - name: Check optional provider and external application discovery
        run: |
          bash scripts/rea-local.sh targets
          bash scripts/rea-local.sh rea providers --json
          bash scripts/rea-local.sh setup-preview
      - name: Verify no scanned estate or global npm artifact
        run: |
          set -eu
          test -d "$BONFYRE_REA_ROOT/releases/6.4.0"
          test ! -e "$HOME/.bonfyre/rea"
          test ! -e "$HOME/.config/rea/bonfyre-client.json"
