name: REA Apple Silicon native decompiler proof

# One real owned Mach-O fixture, not customer/client binaries or a private estate.
on:
  pull_request:
    paths:
      - 'scripts/rea-local.sh'
      - 'Aurekai/native/creator/mix.c'
      - 'Aurekai/native/creator/mix_kernel.c'
      - '.github/workflows/rea-ghidra-native.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rea-ghidra-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-arm64-ghidra:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Validate installer and selected architecture
        run: |
          set -eu
          bash -n scripts/rea-local.sh
          test "$(uname -m)" = arm64
      - name: Isolate REA runtime, full JDK 21, and Ghidra 12.1.4
        run: |
          set -eu
          echo "BONFYRE_REA_ROOT=$RUNNER_TEMP/rea-owned-ghidra" >> "$GITHUB_ENV"
          export BONFYRE_REA_ROOT="$RUNNER_TEMP/rea-owned-ghidra"
          # Exercise the real override as a different storage *directory*.
          # It is on the runner's same volume; the /Volumes mount-device refusal
          # is independently enforced in the helper for the physical Mac.
          export BONFYRE_REA_NATIVE_ROOT="$RUNNER_TEMP/rea native toolchain"
          mkdir -p "$BONFYRE_REA_NATIVE_ROOT"
          echo "BONFYRE_REA_NATIVE_ROOT=$BONFYRE_REA_NATIVE_ROOT" >> "$GITHUB_ENV"
          # Prove the bundled JDK works; a hosted Java must not accidentally
          # satisfy a missing dependency on the user's physical Mac.
          unset JAVA_HOME || true
          bash scripts/rea-local.sh install
          if ! bash scripts/rea-local.sh install-native > "$RUNNER_TEMP/rea-ghidra-install.log" 2>&1; then
            echo "Native Ghidra prerequisite setup failed; bounded terminal diagnostics:"
            tail -n 100 "$RUNNER_TEMP/rea-ghidra-install.log"
            exit 1
          fi
          tail -n 12 "$RUNNER_TEMP/rea-ghidra-install.log"
          test -x "$BONFYRE_REA_NATIVE_ROOT/toolchains/jdk-21.0.12.1+1/Contents/Home/bin/javac"
          decompiler="$BONFYRE_REA_NATIVE_ROOT/engines/ghidra_12.1.4_PUBLIC/Ghidra/Features/Decompiler"
          test -x "$decompiler/build/os/mac_arm_64/decompile" || test -x "$decompiler/os/mac_arm_64/decompile"
          test -x "$decompiler/build/os/mac_arm_64/sleigh" || test -x "$decompiler/os/mac_arm_64/sleigh"
          bash scripts/rea-local.sh install-native > /dev/null
          test -d "$BONFYRE_REA_NATIVE_ROOT/toolchains/gradle-cache"
          test ! -e "$BONFYRE_REA_ROOT/engines/ghidra_12.1.4_PUBLIC"
          test ! -e "$BONFYRE_REA_ROOT/toolchains/jdk-21.0.12.1+1"
      - name: REA Ghidra function dossier on actual event-driven Creator PCM
        run: |
          set -eu
          target="$RUNNER_TEMP/rea-public-creator-mix"
          cc -O2 -g -std=c11 -ffp-contract=off \
            -Wall -Wextra -Wpedantic -Werror \
            Aurekai/native/creator/mix.c Aurekai/native/creator/mix_kernel.c \
            -lm -o "$target"
          bash scripts/rea-local.sh rea function "$target" main \
            --provider ghidra --json > "$RUNNER_TEMP/rea-creator-main-dossier.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const root=process.env.RUNNER_TEMP;
          const bytes=readFileSync(join(root,'rea-public-creator-mix'));
          const record=JSON.parse(readFileSync(join(root,'rea-creator-main-dossier.json'),'utf8'));
          if(typeof record?.evidence_id!=='string'||!record.evidence_id.startsWith('ev_')||
             !record.normalized_result||typeof record.normalized_result!=='object')
            throw Error('REA did not return a native function Evidence dossier');
          console.log(JSON.stringify({schema:'bonfyre.rea.native-creator-function.v1',
            executable_sha256:createHash('sha256').update(bytes).digest('hex'),
            evidence_id:record.evidence_id,
            function_requested:'main',provider:'ghidra',
            facets:Object.keys(record.normalized_result).slice(0,24),
            original_binary_modified:false,independent_runtime_equivalence_proven:false}));
          JS
      - name: REA actually analyzes a compiled Bonfyre-owned Mach-O
        run: |
          set -eu
          test -n "$BONFYRE_REA_ROOT"
          unset JAVA_HOME || true
          cat > "$RUNNER_TEMP/rea-native-fixture.c" <<'C'
          #include <stdint.h>
          __attribute__((noinline))
          int32_t bonfyre_owned_mix_probe(int32_t a, int32_t b) {
            return ((a ^ b) + (a & b)) - (a >> 3);
          }
          int main(void) { return bonfyre_owned_mix_probe(17,23) == 0; }
          C
          cc -O0 -g -std=c11 -Wall -Werror             "$RUNNER_TEMP/rea-native-fixture.c" -o "$RUNNER_TEMP/rea-native-fixture"
          shasum -a 256 "$RUNNER_TEMP/rea-native-fixture"
          bash scripts/rea-local.sh native ghidra             "$RUNNER_TEMP/rea-native-fixture" > "$RUNNER_TEMP/rea-ghidra-evidence.json"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const base=process.env.RUNNER_TEMP;
          const record=JSON.parse(readFileSync(join(base,'rea-ghidra-evidence.json'),'utf8'));
          const bytes=readFileSync(join(base,'rea-native-fixture'));
          if(typeof record.evidence_id!=='string' || !record.evidence_id.startsWith('ev_'))
            throw Error('REA native investigation produced no authentic Evidence receipt');
          console.log(JSON.stringify({state:'macos-arm64-ghidra-analyzed-actual-owned-binary',
            engine:'ghidra-12.1.4',jdk:'21.0.12.1+1',rea:'6.4.0',
            binary_sha256:createHash('sha256').update(bytes).digest('hex'),
            evidence_id:record.evidence_id,
            client_data_included:false,production_performance_inferred:false}));
          JS
