name: Aurekai Journal High-Quality Voice Audition
on:
  push:
    branches: [main]
    paths:
      - 'editorial/audio/studio_qwen3.py'
      - '.github/workflows/journal-studio-audition.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurekai-journal-studio-audition
  cancel-in-progress: true
jobs:
  voice:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Apple Silicon MLX inference
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew list espeak-ng >/dev/null 2>&1 || brew install espeak-ng
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'mlx-audio==0.3.0' 'kokoro-onnx==0.6.1' 'soundfile>=0.13,<0.14'
          python -m py_compile editorial/audio/studio_qwen3.py
      - uses: actions/cache@v4
        with:
          path: .voice-cache
          key: journal-sarah-kokoro-fp16-v1
      - name: Retain exact source-voice model files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .voice-cache editorial/audio/studio-output
          base='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1'
          test -s .voice-cache/kokoro-v1.0.fp16.onnx || curl -fL --retry 3 "$base/kokoro-v1.0.fp16.onnx" -o .voice-cache/kokoro-v1.0.fp16.onnx
          test -s .voice-cache/voices-v1.0.bin || curl -fL --retry 3 "$base/voices-v1.0.bin" -o .voice-cache/voices-v1.0.bin
          shasum -a 256 .voice-cache/* > editorial/audio/studio-output/reference-sha256.txt
      - name: Render source-bound Qwen3 1.7B auditions
        timeout-minutes: 145
        env:
          PYTHONUNBUFFERED: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python editorial/audio/studio_qwen3.py
      - name: Keep recordings and transcripts for editorial listening
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-qwen3-1p7b-voice-audition
          path: editorial/audio/studio-output/
          retention-days: 30
