name: Reusable component replacement
on:
  push:
    branches: [main, refactor/reusable-workbenches-20261015]
    paths:
      - '.github/workflows/reusable-component-checks.yml'
      - 'cmd/BonfyreSurfaceScene/runtime/**'
      - 'integrations/browser/adapters/**'
      - 'scripts/component-*.mjs'
      - 'scripts/tests/component-*'
      - 'components/BonfyreServiceSite/catalogue-grid.mjs'
  pull_request:
    paths:
      - '.github/workflows/reusable-component-checks.yml'
      - 'cmd/BonfyreSurfaceScene/runtime/**'
      - 'integrations/browser/adapters/**'
      - 'scripts/component-*.mjs'
      - 'scripts/tests/component-*'
      - 'components/BonfyreServiceSite/catalogue-grid.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reusable-component-replacement-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retain public ITAD donor without accounts or writes
        run: |
          node --input-type=module <<'JS'
          import {mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {dirname} from 'node:path';
          const origin='https://itad-desk-upgrade.aurekai-work-samples.pages.dev';
          const queue=['/itad-exchange/','/itad-exchange/app.mjs','/itad-exchange/core.mjs','/itad-exchange/manifest-grid.mjs','/itad-exchange/desk.css','/journey-kit/room.mjs','/brief-studio/core.mjs'];
          const done=new Set(),receipt=['path\tsha256\tbytes\tsource'],failures=[];let total=0;
          for(let i=0;i<queue.length;i++){
            const path=queue[i];if(done.has(path))continue;done.add(path);
            if(done.size>100)throw Error('Donor module graph exceeds its file bound');
            const response=await fetch(origin+path,{redirect:'error',signal:AbortSignal.timeout(30000)});
            if(!response.ok){failures.push(path+'\t'+response.status);continue;}
            const bytes=new Uint8Array(await response.arrayBuffer());total+=bytes.length;
            if(bytes.length>4000000||total>18000000)throw Error('Donor material exceeds its size bound');
            const name=path.endsWith('/')?path+'index.html':path,output='component-donors/itad/site'+name;
            await mkdir(dirname(output),{recursive:true});await writeFile(output,bytes);
            receipt.push(name.slice(1)+'\t'+createHash('sha256').update(bytes).digest('hex')+'\t'+bytes.length+'\t'+origin+path);
            const text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
            const refs=[...text.matchAll(/(?:from\s*|import\s*\(\s*|import\s+|new URL\(\s*)["']([^"']+)["']/g),...text.matchAll(/(?:src|href)=["']([^"']+)["']/g)].map(m=>m[1]);
            for(const ref of refs){try{const u=new URL(ref,origin+path);if(u.origin!==origin||u.search||u.hash||!/^\/(itad-exchange|journey-kit|brief-studio)\//.test(u.pathname)||!/\.(?:mjs|js|css)$/.test(u.pathname))continue;if(!done.has(u.pathname))queue.push(u.pathname);}catch{}}
          }
          await writeFile('component-donors/itad/SOURCE.tsv',receipt.join('\n')+'\n');
          await writeFile('component-donors/itad/READ-FAILURES.tsv',failures.join('\n')+'\n');
          console.log('Retained',done.size,'public paths;',total,'bytes; failures:',failures);
          if(failures.some(s=>/\/app.mjs\t|\/core.mjs\t|\/manifest-grid.mjs\t/.test(s)))throw Error('A required donor source was unavailable');
          JS
      - name: Verify reusable source and replace exact donor bundles
        run: |
          node --test scripts/tests/component-contracts.test.mjs scripts/tests/retain-tested-pages.test.mjs scripts/tests/showcase-directory.test.mjs
          node scripts/component-replacement.mjs
      - name: Install isolated browser test driver
        run: npm install --prefix .component-tools --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Verify original catalogue and room journey through shared components
        env:
          SPACES_STUDIO_REQUIRED: '1'
          SPACES_EVIDENCE: component-evidence/catalogue-room
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.component-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/spaces-live-browser.mjs
      - name: Verify both donor workflows and cross-instance reuse
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.component-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/component-browser.mjs
      - name: Keep exact donor source and replacement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reusable-component-donors
          path: |
            component-donors
            component-evidence
          retention-days: 30
