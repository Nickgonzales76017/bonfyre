name: Generation-10 WorkGraph Chaos Lab

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/generation10-workgraph-chaos.yml"
      - "tools/actions/generation10_workgraph_chaos.py"
      - "tools/actions/generation10_contract.json"
      - "engine/core/**"
      - "programs/bonfyre/**"
      - "programs/bonfyred/**"
      - "tests/requirements/workgraph_*.sh"
      - "tests/requirements/completion_controller.sh"
      - "tests/requirements/command_completion.sh"
      - "tests/requirements/daemon_restart.sh"
  push:
    branches:
      - "actions/generation10-system-lab-*"
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * *"

permissions:
  contents: read

concurrency:
  group: generation10-workgraph-chaos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  BONFYRE_CI: "1"
  BONFYRE_CI_NO_EXTERNAL_EFFECTS: "1"
  BONFYRE_AUTHORITY: "observe"
  BONFYRE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lifecycle:
    name: Lifecycle / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario:
          - lease-reap-retry
          - restart-migration
          - fanout-race
          - cancel-compensate
          - effect-completion
    steps:
      - name: Checkout exact source occurrence without Gitlink traversal
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*'
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install WorkGraph substrate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev zlib1g-dev libsqlite3-dev jq curl

      - name: Execute isolated baseline and shared-state reverse pressure
        id: chaos
        continue-on-error: true
        run: |
          python3 tools/actions/generation10_workgraph_chaos.py \
            --scenario "${{ matrix.scenario }}" \
            --timeout 300 \
            --output-dir .generation10/receipts/workgraph-chaos

      - name: Persist lifecycle ReceiptEnvelope before verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g10-workgraph-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: .generation10/receipts/workgraph-chaos/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce isolated lifecycle baseline
        if: steps.chaos.outcome == 'failure'
        run: exit 1

  lifecycle-proof:
    name: Fold WorkGraph lifecycle EvidenceGraph
    needs: lifecycle
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download WorkGraph receipts
        uses: actions/download-artifact@v7
        with:
          pattern: g10-workgraph-*
          path: .generation10/workgraph
          merge-multiple: false

      - name: Seal WorkGraph lifecycle ProofBundle
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          expected = {
              'lease-reap-retry',
              'restart-migration',
              'fanout-race',
              'cancel-compensate',
              'effect-completion',
          }
          receipts = []
          for path in sorted(Path('.generation10/workgraph').rglob('*.json')):
              payload = json.loads(path.read_text())
              if payload.get('schema') != 'bonfyre.generation10.action-receipt.v1':
                  raise SystemExit(f'wrong schema: {path}')
              if payload.get('git_sha') != os.environ['SOURCE_SHA']:
                  raise SystemExit(f'stale factor: {path}')
              receipts.append({
                  'scenario': payload['subject'],
                  'outcome': payload['outcome'],
                  'baseline_failure_count': payload['baseline_failure_count'],
                  'stress_failure_count': payload['stress_failure_count'],
                  'order_or_shared_state_sensitivity': payload['order_or_shared_state_sensitivity'],
                  'content_sha256': payload['content_sha256'],
                  'receipt_file_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })

          observed = {item['scenario'] for item in receipts}
          missing = sorted(expected - observed)
          failed = sorted(item['scenario'] for item in receipts if item['outcome'] == 'failed')
          sensitive = sorted(item['scenario'] for item in receipts if item['order_or_shared_state_sensitivity'])
          bundle = {
              'schema': 'bonfyre.generation10.workgraph-lifecycle-proof.v1',
              'git_sha': os.environ['SOURCE_SHA'],
              'semantic_owner': 'WorkGraph',
              'expected_scenarios': sorted(expected),
              'missing_scenarios': missing,
              'failed_baselines': failed,
              'shared_state_or_order_sensitive': sensitive,
              'stress_policy': 'evidence_only',
              'receipts': receipts,
          }
          canonical = lambda value: (json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n').encode()
          bundle['proof_sha256'] = hashlib.sha256(canonical(bundle)).hexdigest()
          Path('.generation10/workgraph-lifecycle-proof.json').write_bytes(canonical(bundle))
          Path('.generation10/workgraph-lifecycle-summary.md').write_text(
              '# Generation-10 WorkGraph Lifecycle Proof\n\n'
              f"- source: `{bundle['git_sha']}`\n"
              f"- scenarios: **{len(receipts)}/5**\n"
              f"- baseline failures: **{len(failed)}**\n"
              f"- shared-state/order sensitivity: **{len(sensitive)}**\n"
              f"- proof: `{bundle['proof_sha256']}`\n"
          )
          print(Path('.generation10/workgraph-lifecycle-summary.md').read_text())
          if missing or failed:
              raise SystemExit(1)
          PY

      - name: Publish WorkGraph ProofBundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generation10-workgraph-proof-${{ env.BONFYRE_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            .generation10/workgraph-lifecycle-proof.json
            .generation10/workgraph-lifecycle-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Render lifecycle proof
        if: always()
        run: cat .generation10/workgraph-lifecycle-summary.md >> "$GITHUB_STEP_SUMMARY"
