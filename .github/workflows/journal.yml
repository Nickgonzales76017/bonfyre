name: Aurekai Journal Validation
on:
  push:
    branches: [main]
    paths:
      - 'editorial/posts/**'
      - 'editorial/reading-bridges.tsv'
      - 'scripts/tests/journal-discoverability.py'
      - 'scripts/tests/editorial-*.py'
      - 'site/index.html'
      - 'scripts/render-editorial.sh'
      - 'scripts/retain-tested-pages.mjs'
      - 'scripts/tests/retain-tested-pages.test.mjs'
      - 'site/blog/**'
      - 'site/series/**'
      - '.github/workflows/journal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout journal source
        uses: actions/checkout@v4
      - name: Render journal from editable Markdown
        run: sh scripts/render-editorial.sh
      - name: Check deterministic output and public entry points
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/render-editorial.sh --check
          python3 scripts/tests/journal-discoverability.py
          node --check site/blog/reader.js
          expected="$(grep -l '^status: edited-public$' editorial/posts/*.md | wc -l)"
          # Additional Journal routes such as /about/ are not article records.
          test "$(grep -c '^post:' site/blog/post-index.tsv)" -eq "$expected"
          test "$(grep -c '<item>' site/blog/feed.xml)" -eq "$expected"
          test "$(grep -c '<url>' site/blog/sitemap.xml)" -eq "$((expected+3))"
          test "$(wc -l < site/blog/post-index.tsv)" -eq "$((expected+1))"
          grep -q "All articles / $expected" site/blog/index.html
          grep -q 'data-filter="Debates"' site/blog/index.html
          grep -q 'data-filter="Mathematics"' site/blog/index.html
          grep -q 'data-filter="Markets"' site/blog/index.html
          grep -q 'data-filter="Science"' site/blog/index.html
          test -f site/sitemap.xml
          grep -q 'bonfyre/blog/the-machine-told-me-so/' site/sitemap.xml
          grep -q 'application/ld+json' site/blog/the-machine-told-me-so/index.html
          grep -q 'BreadcrumbList' site/blog/the-machine-told-me-so/index.html
          test -f site/blog/reader.js
          test -f site/blog/reader.css
          test -f site/blog/about/index.html
          test -f site/series/index.html
          grep -q 'id="authority"' site/series/index.html
          grep -q 'id="operators"' site/series/index.html
          grep -q 'reader-outline-menu' site/blog/the-machine-told-me-so/index.html
          grep -q 'journal-audio-player' site/blog/who-keeps-the-internet-alive/index.html
          grep -q 'data-narration-play' site/blog/who-keeps-the-internet-alive/index.html
          grep -q 'journal-audio-transcript' site/blog/who-keeps-the-internet-alive/index.html
          grep -q 'data-narration-seek' site/blog/who-keeps-the-internet-alive/index.html
          grep -q 'data-narration-wave' site/blog/the-machine-told-me-so/index.html
          grep -q 'href="#audio-edition"' site/blog/the-machine-told-me-so/index.html
          grep -q 'journal-sources' site/blog/the-machine-told-me-so/index.html
          grep -q 'itemscope itemtype="https://schema.org/BlogPosting"' site/blog/the-machine-told-me-so/index.html
          grep -q 'og:image' site/blog/the-machine-told-me-so/index.html
          grep -q 'journal-card-outline' site/blog/index.html
          test "$(grep -c 'class="essay-chapter ' site/series/index.html)" -eq 4
      - name: Verify article search and reading readiness
        run: python3 scripts/tests/editorial-search-readiness.py
      - name: Verify editorial-only rebase preserves the tested release
        run: node --test scripts/tests/retain-tested-pages.test.mjs
      - name: Verify two-way editorial reading graph and truthful publication dates
        run: python3 scripts/tests/editorial-reading-graph.py
      - name: Archive website output
        uses: actions/upload-artifact@v4
        with:
          name: aurekai-journal-static
          retention-days: 14
          path: site/blog
