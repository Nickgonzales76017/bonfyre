name: Estate CSS

# Served stylesheets are compiled from PostCSS sources by the pinned toolchain.
# Check that the outputs match a fresh build.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tailwind-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the compiled estate stylesheet
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          cd deploy/tailwind && bun run check
