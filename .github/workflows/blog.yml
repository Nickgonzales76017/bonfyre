name: Aurekai Journal
on:
  push:
    branches: [main]
    paths:
      - 'editorial/**'
      - 'scripts/build-blog.mjs'
      - 'scripts/tests/blog-build.test.mjs'
      - 'site/blog/**'
      - '.github/workflows/blog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generator and browser controls
        run: |
          node --check scripts/build-blog.mjs
          node --check site/blog/filter.js
      - name: Build journal
        run: node scripts/build-blog.mjs
      - name: Verify output and editorial integrity
        run: |
          node scripts/build-blog.mjs --check
          node --test scripts/tests/blog-build.test.mjs
      - name: Keep the compiled static journal
        uses: actions/upload-artifact@v4
        with:
          name: aurekai-journal
          path: site/blog
          retention-days: 14
