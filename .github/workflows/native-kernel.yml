  control-conformance:
    name: native control conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject new Python runtime sources
        shell: bash
        run: |
          set -euo pipefail
          base_ref="$(printenv GITHUB_BASE_REF || true)"
          if [ -z "$base_ref" ]; then base_ref=main; fi
          base="origin/$base_ref"
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          added="$(git diff --name-only --diff-filter=A "$base"...HEAD | grep -E '\.py$' || true)"
          if [ -n "$added" ]; then
            echo "::error::New Python source is forbidden. Extend C, Zig, C++, or Bun/TypeScript instead."
            printf '%s\n' "$added"
            exit 1
          fi

      - name: Reject Python runtime wrappers
        shell: bash
        run: |
          set -euo pipefail
          wrappers="$(rg -n -e '(^|[[:space:]])python(3)?([[:space:]]|$)' bin --glob '!*.py' || true)"
          if [ -n "$wrappers" ]; then
            echo "::error::bin/ launchers must dispatch native or Bun-compiled commands, never Python."
            printf '%s\n' "$wrappers"
            exit 1
          fi

      - name: Reject interpreter-backed shell paths
        shell: bash
        run: |
          set -euo pipefail
          shell_paths="$(rg -n -i '(^|[^[:alnum:]_])python3?([^[:alnum:]_]|$)' scripts bin components cmd services integrations/erpnext_app --glob '*.sh' --glob 'bonfyre-*' --glob '*.pl' --glob '!*archive' || true)"
          if [ -n "$shell_paths" ]; then
            echo "::error::Runtime shell paths must use native/Bun organs, never an interpreter."
            printf '%s\n' "$shell_paths"
            exit 1
          fi

      - name: Reject interpreter exec from native runtime
        shell: bash
        run: |
          set -euo pipefail
          exec_edges="$(rg -n -i 'exec[a-z]*\([^\n]*python|system\([^\n]*python' engine cmd lib components --glob '*.{c,cc,cpp}' --glob '!*archive' || true)"
          if [ -n "$exec_edges" ]; then
            echo "::error::Native runtime may not spawn an interpreter."
            printf '%s\n' "$exec_edges"
            exit 1
          fi

      - name: Reject executable Python in absorbed estates
        shell: bash
        run: |
          set -euo pipefail
          python_files="$(find components scripts services bin cmd .bonfyre integrations/erpnext_app content/contributions -path '*/venv/*' -prune -o -type f -name '*.py' -print 2>/dev/null || true)"
          if [ -n "$python_files" ]; then
            echo "::error::Absorbed estates may retain only .py.archive evidence, never executable .py files."
            printf '%s\n' "$python_files"
            exit 1
          fi

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - uses: oven-sh/setup-bun@v2

      - name: Replay retired ControlPlane witnesses in Bun
        run: make control-plane-native-test

      - name: Replay vectors against the native kernel
        run: zig build test-control

      - name: Native control suite is self-contained
        run: make -C engine/core test

  fabric-roundtrip:
    name: BonfyreFS mounts a real fabric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install FUSE and SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse-dev libsqlite3-dev pkg-config fuse

      - name: Build the fabric and BonfyreFS
        run: |
          zig build
          make -C cmd/BonfyreFS

      - name: Ingest a known artifact into a fresh fabric
        env:
          BONFYRE_STATE_DIR: ${{ runner.temp }}/fabric
        run: |
          mkdir -p "$BONFYRE_STATE_DIR"
          ./zig-out/bin/bonfyre fabric init
          ./zig-out/bin/bonfyre mission create ci-roundtrip
          # A file whose digest we can recompute independently.
          ./zig-out/bin/bonfyre artifact ingest schemas/control/work.yaff text/plain \
            | tee "$RUNNER_TEMP/ingest.txt"
          ./zig-out/bin/bonfyre fabric status

      - name: Mount as a daemon and read it back
        env:
          BONFYRE_STATE_DIR: ${{ runner.temp }}/fabric
        run: |
          set -euo pipefail
          MOUNT="$RUNNER_TEMP/mnt"
          mkdir -p "$MOUNT"

          # Deliberately NOT -f. Foreground mode never forks, and the fork is
          # exactly what broke this before.
          ./cmd/BonfyreFS/bonfyre-fs "$MOUNT"

          for _ in $(seq 1 20); do
            mountpoint -q "$MOUNT" && break
            sleep 0.5
          done
          mountpoint -q "$MOUNT" || { echo "::error::mount never appeared"; exit 1; }

          echo "--- Missions ---"; ls -1 "$MOUNT/Missions"
          echo "--- Artifacts ---"; ls -1 "$MOUNT/Artifacts"

          if [ -z "$(ls -A "$MOUNT/Missions")" ]; then
            echo "::error::Missions/ is empty but the fabric has a mission."
            echo "::error::This is the daemon-fork regression: a SQLite handle"
            echo "::error::opened before fuse_main() does not survive the fork."
            fusermount -u "$MOUNT" || true
            exit 1
          fi

          test -f "$MOUNT/Missions/ci-roundtrip.json"
          grep -q '"mission_id":"ci-roundtrip"' "$MOUNT/Missions/ci-roundtrip.json"

          # The artifact is content-addressed: its filename must be the digest
          # of the bytes we ingested.
          DIGEST=$(sha256sum schemas/control/work.yaff | cut -d' ' -f1)
          test -f "$MOUNT/Artifacts/$DIGEST.json" \
            || { echo "::error::no artifact projected for digest $DIGEST"; \
                 ls -1 "$MOUNT/Artifacts"; fusermount -u "$MOUNT"; exit 1; }

          fusermount -u "$MOUNT"

  restate-native:
    name: native Restate durable carrier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and discover the native Restate service
        run: make -C services/bonfyre-restate-native test

  url-matrix:
    name: native URL matrix and owned-domain boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # make compiles the experience declarations into C headers with bun when a
      # fresh checkout leaves their inputs newer than the generated output.
      - uses: oven-sh/setup-bun@v2

      - name: Install native URL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libcurl4-openssl-dev

      - name: Exercise address constellation, host context, carriers, and DNS guard
        run: |
          make -C cmd/BonfyreWebAddress test
          make -C cmd/BonfyreDomain test

  native-commands:
    name: cmd/Bonfyre* build and answer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Build every command that has a Makefile
        id: build
        run: |
          set -uo pipefail
          built=0; failed=0
          : > "$RUNNER_TEMP/failures.txt"
          for dir in cmd/Bonfyre*/; do
            [ -f "$dir/Makefile" ] || continue
            if make -C "$dir" >/dev/null 2>>"$RUNNER_TEMP/failures.txt"; then
              built=$((built+1))
            else
              failed=$((failed+1))
              echo "$dir" >> "$RUNNER_TEMP/failed-dirs.txt"
            fi
          done
          echo "built=$built failed=$failed"
          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/failed-dirs.txt" ]; then
            echo "::group::commands that did not build"
            cat "$RUNNER_TEMP/failed-dirs.txt"
            echo "::endgroup::"
          fi

      # Reported rather than gating, because the current baseline is unknown --
      # nothing has ever built these in CI. Once a green baseline exists this
      # should fail on any regression.
      - name: Summary
        run: |
          {
            echo "### Native command build"
            echo
            echo "built: ${{ steps.build.outputs.built }}"
            echo "failed: ${{ steps.build.outputs.failed }}"
          } >> "$GITHUB_STEP_SUMMARY"
