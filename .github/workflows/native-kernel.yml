name: native kernel

# The native kernel had no CI. 7,722 lines of C in engine/core, the control
# primitives, the conformance vectors and 88 cmd/Bonfyre* binaries were all
# verified only by whoever last ran them locally.
#
# The BonfyreFS job is the one that matters most: it mounts a fabric and reads
# it back through the filesystem. The fork bug that made daemon mode list an
# empty tree passed every build and every unit test, and only a real mount
# would have caught it -- so this asserts on mounted content, not on exit codes.

on:
  push:
    paths:
      - "engine/**"
      - "lib/**"
      - "cmd/BonfyreFS/**"
      - "cmd/BonfyreWebAddress/**"
      - "cmd/BonfyreDomain/**"
      - "deploy/nginx/bonfyre-addressplane.conf"
      - "deploy/cloudflared/bonfyre-addressplane-ingress.yml"
      - "deploy/systemd/bonfyre-web-address.*"
      - "cmd/BonfyreOperator/**"
      - "bin/**"
      - "programs/**"
      - "build.zig"
      - "schemas/control/**"
      - "tests/conformance/**"
      - "components/BonfyreControlPlane/**"
      - "components/**/*.sh"
      - "cmd/**/*.sh"
      - "scripts/**"
      - "integrations/mcp/**"
      - "architecture/tests/**"
      - "deploy/**/*.sh"
      - "deploy/launchd/**"
      - "mcp/**/*.sh"
      - "services/**/*.sh"
      - "services/bonfyre-restate-native/**"
      - "tests/restate_integration.sh"
      - "tools/transitional_root_absorption.py"
      - "tests/test_transitional_root_absorption.py"
      - "generated/projections/estate/transitional-root-absorption.json"
      - "architecture/institutional/transitional-root.yaff"
      - ".github/workflows/native-kernel.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

