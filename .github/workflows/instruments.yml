name: Verify native instruments
on:
  push:
    branches: [native-instruments-20261019, instrument-public-readiness-20261019]
  pull_request:
    paths:
      - 'components/BonfyreServiceSite/instruments/**'
      - 'site/instruments/**'
      - 'scripts/*instruments*.mjs'
      - 'scripts/tests/instruments-*.mjs'
      - '.github/workflows/instruments.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute calculations, actual SQLite and retained release regressions
        run: node --test scripts/tests/instruments-core.test.mjs scripts/tests/instruments-readiness.test.mjs scripts/tests/showcase-directory.test.mjs scripts/tests/retain-tested-pages.test.mjs
      - name: Install pinned SQLite and browser driver without lifecycle scripts
        run: npm install --prefix .spaces-tools --ignore-scripts --no-audit --no-fund playwright@1.56.1 sql.js@1.13.0
      - name: Build from existing shared owners
        env:
          INSTRUMENT_REQUIRE_SQLITE: '1'
        run: node scripts/build-instruments.mjs
      - name: Exercise actual instruments and exported SQLite in Chromium
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.spaces-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/instruments-browser.mjs
      - name: Verify directory publication and repeated projection
        run: |
          node scripts/prepare-instruments-discovery.mjs
          node --test scripts/tests/showcase-directory.test.mjs
          node scripts/prepare-instruments-discovery.mjs
          node --test scripts/tests/showcase-directory.test.mjs
      - name: Preserve browser and execution results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-verification
          retention-days: 14
          path: |
            instrument-evidence
            site/instruments/SOURCE.tsv
      - name: Retain tested candidate for the existing site
        uses: actions/upload-artifact@v4
        with:
          name: tested-instruments
          retention-days: 14
          path: site/instruments
