name: Aurekai Journal Full-Length Studio Master
on:
  push:
    branches: [main]
    paths: ['.github/workflows/journal-studio-master.yml']
  workflow_dispatch:
    inputs:
      slug:
        description: 'Exact edited-public article slug to master'
        required: true
        type: string
        default: sites-are-dead-long-live-the-web
permissions:
  contents: read
jobs:
  master:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline neural audio runtime
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew list espeak-ng >/dev/null 2>&1 || brew install espeak-ng
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install 'mlx-audio==0.3.0' 'kokoro-onnx==0.6.1' 'soundfile>=0.13,<0.14'
          python -m py_compile editorial/audio/studio_master.py
      - uses: actions/cache@v4
        with:
          path: .voice-cache
          key: journal-sarah-kokoro-fp16-v1
      - name: Verify original synthetic narrator reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .voice-cache
          base='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1'
          test -s .voice-cache/kokoro-v1.0.fp16.onnx || curl -fL --retry 3 "$base/kokoro-v1.0.fp16.onnx" -o .voice-cache/kokoro-v1.0.fp16.onnx
          test -s .voice-cache/voices-v1.0.bin || curl -fL --retry 3 "$base/voices-v1.0.bin" -o .voice-cache/voices-v1.0.bin
          shasum -a 256 .voice-cache/*
      - name: Master the complete article once with Qwen3 1.7B
        timeout-minutes: 270
        env:
          PYTHONUNBUFFERED: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          slug='sites-are-dead-long-live-the-web'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            slug="$(python -c 'import os,json; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"]["slug"])')"
          fi
          python editorial/audio/studio_master.py "$slug"
      - name: Retain lossless master and encoded draft for listening approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-high-quality-full-article-draft
          path: editorial/audio/master/
          retention-days: 30
