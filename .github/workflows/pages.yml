name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application directory and retained release
        run: |
          node --test scripts/tests/showcase-directory.test.mjs scripts/tests/retain-tested-pages.test.mjs scripts/tests/component-contracts.test.mjs scripts/tests/workspace-composition.test.mjs scripts/tests/instruments-core.test.mjs
          test -f site/spaces/RELEASE.tsv
      - name: Detect retained helper dependencies
        id: helpers
        run: |
          if test -f vendor/spaces-helpers-20261015/SOURCE.txt; then echo 'needed=false' >> "$GITHUB_OUTPUT"; else echo 'needed=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.helpers.outputs.needed == 'true'
        with:
          name: spaces-helper-inputs
          run-id: 38803211793
          github-token: ${{ github.token }}
          path: studio-inputs/archives
      - uses: actions/download-artifact@v4
        if: steps.helpers.outputs.needed == 'true'
        with:
          name: product-scene-public-inputs
          run-id: 38791615713
          github-token: ${{ github.token }}
          path: studio-inputs/retained
      - name: Verify archives and extract without installation scripts
        if: steps.helpers.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd studio-inputs/archives
          echo '489d6e0c991108023d13fa169be53a932a682cc88c4e3b33a30ec494a55d7767  camera-controls-3.1.2.tgz' | sha256sum --check
          echo '559c47e9bec146242c364f43c542d8f0d8fda839c8fe7348c9011787551fc0ae  pmndrs-vanilla-1.25.0.tgz' | sha256sum --check
          cd ../..
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';import {createHash} from 'node:crypto';
          const row=readFileSync('studio-inputs/retained/SHA256SUMS.tsv','utf8').split('\n').find(s=>s.startsWith('upstream/three-0.180.0.tgz\t'));
          if(!row)throw Error('Pinned Three archive receipt missing.');
          const [path,hash,size]=row.split('\t'),body=readFileSync('studio-inputs/retained/'+path);
          if(body.length!==Number(size)||createHash('sha256').update(body).digest('hex')!==hash)throw Error('Pinned Three archive changed.');
          JS
          mkdir -p studio-inputs/{camera,drei,three}
          tar -xzf studio-inputs/archives/camera-controls-3.1.2.tgz -C studio-inputs/camera
          tar -xzf studio-inputs/archives/pmndrs-vanilla-1.25.0.tgz -C studio-inputs/drei
          tar -xzf studio-inputs/retained/upstream/three-0.180.0.tgz -C studio-inputs/three
      - name: Build immutable studio UI packages
        run: |
          node --check components/BonfyreServiceSite/product-scene-tools.mjs
          node --check scripts/upgrade-spaces.mjs
          node scripts/upgrade-spaces.mjs site/spaces studio-inputs
          node scripts/component-release.mjs site/spaces
      - name: Install pinned browser driver and SQLite without lifecycle scripts
        run: npm install --prefix .spaces-tools --ignore-scripts --no-audit --no-fund playwright@1.56.1 sql.js@1.13.0
      - name: Build and verify the four working instruments
        env:
          INSTRUMENT_REQUIRE_SQLITE: '1'
        run: |
          node scripts/build-instruments.mjs
          export PLAYWRIGHT_MODULE="$PWD/.spaces-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/instruments-browser.mjs
      - name: Verify rendered product and room interactions before publication
        env:
          SPACES_STUDIO_REQUIRED: '1'
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.spaces-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/spaces-live-browser.mjs
      - name: Connect showcase entries to the tested releases
        run: |
          node scripts/prepare-spaces-discovery.mjs
          node scripts/prepare-instruments-discovery.mjs
          node --test scripts/tests/showcase-directory.test.mjs
      - name: Retain tested release and helper licences
        shell: bash
        env:
          SPACES_STUDIO_REQUIRED: '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export PLAYWRIGHT_MODULE="$PWD/.spaces-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/retain-tested-pages.mjs
      - name: Verify final composed workspaces and retained editors
        env:
          WORKSPACE_EVIDENCE: workspace-evidence
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.spaces-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/workspace-composition-browser.mjs
          node scripts/tests/workspace-docking-browser.mjs
      - name: Build and verify Aurekai Journal articles
        run: |
          sh scripts/render-editorial.sh
          sh scripts/render-editorial.sh --check
          test "$(grep -c '^post:' site/blog/post-index.tsv)" -eq "$(grep -l 'status: edited-public' editorial/posts/*.md | wc -l)"
          test "$(grep -c '<item>' site/blog/feed.xml)" -eq "$(grep -l '^status: edited-public$' editorial/posts/*.md | wc -l)"
          grep -q "All articles / $(grep -l '^status: edited-public$' editorial/posts/*.md | wc -l)" site/blog/index.html
      - name: Browser-check Fieldwork stories and cross-site search
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site >/tmp/aurekai-pages-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          export CHROME_PATH="$(command -v google-chrome)"
          node --input-type=module <<'NODE'
          import { chromium } from './.spaces-tools/node_modules/playwright/index.mjs';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1366,height:900}});
          const errors=[];
          const expectedArticles=readFileSync('site/discover/article-index.tsv','utf8').trimEnd().split('\n').length-1;
          page.on('pageerror',e=>errors.push(e.message));
          try {
            await page.goto('http://127.0.0.1:8765/fieldwork/',{waitUntil:'networkidle'});
            assert.equal(await page.locator('h1').count(),1);
            assert.equal(await page.locator('.fw-chapter').count(),5);
            assert.equal(await page.locator('.fw-story-index a').count(),5);
            assert.equal(await page.locator('a[href="../spaces/catalogue/"]').count(),1);
            assert.equal(await page.locator('a[href="../blog/"]').count()>=1,true);
            for(const image of await page.locator('.fw-cover-art img, .fw-product-image img').all()){
              await image.scrollIntoViewIfNeeded();
              await image.evaluate(el=>el.decode());
              assert.equal(await image.evaluate(el=>el.complete && el.naturalWidth>0),true);
            }
            await page.locator('a[href="#inventory"]').first().click();
            assert.equal(new URL(page.url()).hash,'#inventory');
            await page.goto('http://127.0.0.1:8765/labs/',{waitUntil:'load'});
            await page.waitForURL('**/fieldwork/');
            assert.equal(await page.locator('input[type="number"]').count(),0);
            await page.goto('http://127.0.0.1:8765/discover/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(n=>document.querySelectorAll('[data-kind="article"]').length===n,expectedArticles,{timeout:12000});
            assert.equal(await page.locator('[data-kind="studio"]').count(),20);
            assert.equal(await page.locator('[data-kind="tool"]').count(),4);
            assert.equal(await page.locator('[data-kind="article"]').count(),expectedArticles);
            await page.getByRole('button',{name:'Articles',exact:true}).click();
            assert.equal(await page.locator('[data-kind="article"]:visible').count(),expectedArticles);
            await page.locator('#discover-search').fill('podcast');
            await page.getByRole('button',{name:'Studios',exact:true}).click();
            assert.ok((await page.locator('[data-kind="studio"]:visible').count())>=1);
            await page.goto('http://127.0.0.1:8765/blog/why-base-rates-change-camera-matching-claims/',{waitUntil:'domcontentloaded'});
            assert.equal(await page.locator('a[href="../../fieldwork/"]').count(),1);
            assert.equal(await page.locator('a[href*="/labs/#"]').count(),0);
            // Editorial audio is a real published recording, never the device
            // speech synthesizer or a fake, randomly generated waveform.
            await page.goto('http://127.0.0.1:8765/blog/the-machine-told-me-so/',{waitUntil:'domcontentloaded'});
            assert.equal(await page.locator('[data-narration-voice]').count(),0);
            assert.equal(await page.locator('.journal-audio-voice-choice').count(),0);
            const edition=page.locator('[data-narration]');
            if (await edition.count()) {
              assert.equal(await page.locator('[data-audio-source][src="./edition.mp3"]').count(),1);
              await page.waitForFunction(()=>{
                const audio=document.querySelector('[data-audio-source]');
                return audio && Number.isFinite(audio.duration) && audio.duration > 0;
              },{timeout:20000});
              assert.equal(await page.locator('[data-audio-play]').isVisible(),true);
              await page.locator('[data-audio-play]').click();
              await page.waitForFunction(()=>{
                const audio=document.querySelector('[data-audio-source]');
                return !audio.paused && audio.currentTime > 0;
              },{timeout:12000});
              await page.locator('[data-audio-play]').click();
              assert.equal(await page.locator('[data-audio-source]').evaluate(el=>el.paused),true);
              await page.locator('[data-audio-seek]').evaluate(el=>{
                el.value='400';
                el.dispatchEvent(new Event('input',{bubbles:true}));
                el.dispatchEvent(new Event('change',{bubbles:true}));
              });
              assert.ok(await page.locator('[data-audio-source]').evaluate(el=>
                Math.abs(el.currentTime/el.duration-.4)<.06
              ));
              await page.locator('[data-audio-speed]').click();
              assert.equal(await page.locator('[data-audio-source]').evaluate(el=>el.playbackRate),1.25);
              await page.setViewportSize({width:390,height:844});
              assert.equal(await page.locator('[data-audio-play]').isVisible(),true);
              await page.setViewportSize({width:1366,height:900});
            } else {
              assert.equal(await page.locator('#audio-edition').count(),0);
              assert.equal(await page.locator('a.journal-audio-jump').count(),0);
            }
            assert.equal(await page.locator('[data-narration-voice]').count(),0);
            assert.equal(errors.length,0,errors.join('; '));
            console.log('PASS: five editorial chapters, source imagery, article routes and directory search');
          } finally { await browser.close(); }
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the actual public studio
        env:
          SPACES_ORIGIN: https://nickgonzales76017.github.io
          SPACES_EVIDENCE: spaces-live-evidence
          SPACES_STUDIO_REQUIRED: '1'
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.spaces-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/spaces-live-browser.mjs
      - name: Verify the public composed workflows
        env:
          WORKSPACE_ORIGIN: https://nickgonzales76017.github.io
          WORKSPACE_EVIDENCE: workspace-live-evidence
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.spaces-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/workspace-composition-browser.mjs
          node scripts/tests/workspace-docking-browser.mjs
      - name: Verify actual public instruments and downloaded results
        env:
          INSTRUMENT_ORIGIN: https://nickgonzales76017.github.io/bonfyre/instruments/
          INSTRUMENT_EVIDENCE: instrument-live-evidence
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.spaces-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/instruments-browser.mjs
      - name: Keep local and live browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spaces-release-evidence
          retention-days: 30
          path: |
            spaces-evidence
            spaces-live-evidence
            workspace-evidence
            workspace-live-evidence
            instrument-evidence
            instrument-live-evidence
            site/instruments/SOURCE.tsv
