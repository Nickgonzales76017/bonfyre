name: Workspace composition
on:
  push:
    branches: [main, feat/composed-workspaces-20261016]
    paths:
      - 'cmd/BonfyreSurfaceScene/runtime/**'
      - 'integrations/browser/adapters/**'
      - 'scripts/workspace-*.mjs'
      - 'scripts/component-release.mjs'
      - 'scripts/tests/workspace-*'
      - '.github/workflows/workspace-composition.yml'
  pull_request:
    paths:
      - 'cmd/BonfyreSurfaceScene/runtime/**'
      - 'integrations/browser/adapters/**'
      - 'scripts/workspace-*.mjs'
      - 'scripts/component-release.mjs'
      - 'scripts/tests/workspace-*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-composition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retain exact source basis
        run: |
          mkdir -p workspace-inputs
          git archive --format=tar HEAD cmd/BonfyreSurfaceScene/runtime components/BonfyreServiceSite scripts site/spaces > workspace-inputs/source.tar
          git rev-parse HEAD > workspace-inputs/COMMIT.txt
          sha256sum workspace-inputs/* > workspace-inputs/SHA256SUMS
      - name: Build and test source contracts
        id: build
        run: |
          node --test scripts/tests/workspace-composition.test.mjs scripts/tests/component-contracts.test.mjs
          node scripts/workspace-composition.mjs
          npm install --prefix .workspace-tools --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Existing catalogue-to-room regression
        if: steps.build.outcome == 'success'
        env:
          SPACES_STUDIO_REQUIRED: '1'
          SPACES_EVIDENCE: workspace-evidence/regression
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.workspace-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/spaces-live-browser.mjs
      - name: Combined workspace interactions
        if: always() && steps.build.outcome == 'success'
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.workspace-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/workspace-composition-browser.mjs
      - name: Pointer docking and retained editors
        if: always() && steps.build.outcome == 'success'
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.workspace-tools/node_modules/playwright/index.mjs"
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/tests/workspace-docking-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-composition-material
          path: |
            workspace-inputs
            workspace-evidence
            site/spaces/assets/workspace-docking
          retention-days: 14
