name: Federated submodules

on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'integrations/federated/**'
      - 'examples/federated/**'
      - 'scripts/federated_modules.sh'
      - 'scripts/performance_equivalence.mjs'
      - 'scripts/performance_physical_receipts.mjs'
      - 'scripts/tests/performance_physical_receipts.test.mjs'
      - 'scripts/tests/performance_equivalence.test.mjs'
      - 'site/modules/**'
      - '.github/workflows/federated-submodules.yml'
      - '.gitignore'
      - 'Aurekai/.gitignore'
      - 'Aurekai/README.md'
      - 'Aurekai/bin/akai.mjs'
      - 'Aurekai/src/integration-repo-scaffold.mjs'
      - 'Aurekai/src/integration-engine.mjs'
      - 'Aurekai/src/integration-connectors.mjs'
      - 'Aurekai/src/policy-family-evaluator.mjs'
      - 'Aurekai/src/residual-calibrator.mjs'
      - 'Aurekai/tests/**'
      - 'Aurekai/registry/**'
      - 'Aurekai/generated/integration-repos/**'
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'integrations/federated/**'
      - 'examples/federated/**'
      - 'scripts/federated_modules.sh'
      - 'scripts/performance_equivalence.mjs'
      - 'scripts/performance_physical_receipts.mjs'
      - 'scripts/tests/performance_physical_receipts.test.mjs'
      - 'scripts/tests/performance_equivalence.test.mjs'
      - 'site/modules/**'
      - '.github/workflows/federated-submodules.yml'
      - '.gitignore'
      - 'Aurekai/.gitignore'
      - 'Aurekai/README.md'
      - 'Aurekai/bin/akai.mjs'
      - 'Aurekai/src/integration-repo-scaffold.mjs'
      - 'Aurekai/src/integration-engine.mjs'
      - 'Aurekai/src/integration-connectors.mjs'
      - 'Aurekai/src/policy-family-evaluator.mjs'
      - 'Aurekai/src/residual-calibrator.mjs'
      - 'Aurekai/tests/**'
      - 'Aurekai/registry/**'
      - 'Aurekai/generated/integration-repos/**'

permissions:
  contents: read

jobs:
  verify-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Validate script and pinned public source references without fetching
        run: |
          bash -n scripts/federated_modules.sh
          bash scripts/federated_modules.sh verify all
          bash scripts/federated_modules.sh verify products
          bash scripts/federated_modules.sh verify aurekai
          bash scripts/federated_modules.sh verify frappe
          bash scripts/federated_modules.sh verify interfaces
          bash scripts/federated_modules.sh verify performance
          bash scripts/federated_modules.sh verify perf-memory
          bash scripts/federated_modules.sh verify perf-model
          bash scripts/federated_modules.sh verify one integrations/federated/interfaces/opentui
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only no-loss performance receipt review
        run: node --test scripts/tests/performance_equivalence.test.mjs
      - name: Read back native physical CopyReceipts without mutations
        run: node --test scripts/tests/performance_physical_receipts.test.mjs
      - name: Verify generated integration stubs are reproducible, not tracked pseudo-repositories
        run: |
          test ! -e Aurekai/generated/integration-repos
          git check-ignore -q Aurekai/generated/integration-repos/autogen/integration.manifest.json
          node --input-type=module <<'JS'
          import { mkdtempSync, existsSync, readFileSync, rmSync, mkdirSync, symlinkSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          import { scaffoldIntegrationRepos } from './Aurekai/src/integration-repo-scaffold.mjs';
          const destination = mkdtempSync(join(tmpdir(), 'aurekai-integration-scaffolds-'));
          try {
            const index = scaffoldIntegrationRepos(resolve('Aurekai'), { outDir: destination });
            if (index.count !== 108 || index.repos.length !== index.count) {
              throw Error('Expected the 108 declared May-2026 starter targets to regenerate');
            }
            const names = new Set();
            for (const repo of index.repos) {
              if (names.has(repo.slug)) throw Error('Duplicate scaffold slug ' + repo.slug);
              names.add(repo.slug);
              const manifest = JSON.parse(readFileSync(join(destination, repo.slug, 'integration.manifest.json'), 'utf8'));
              if (manifest.slug !== repo.slug || manifest.repo_name !== 'aurekai-integration-' + repo.slug ||
                  !existsSync(join(destination, repo.slug, 'src/index.mjs')) ||
                  !existsSync(join(destination, repo.slug, 'test-vectors/continuity-pass.json')) ||
                  !existsSync(join(destination, repo.slug, 'test-vectors/continuity-fail.json'))) {
                throw Error('Incomplete generated scaffold ' + repo.slug);
              }
            }
            // The same source contract must yield exact artifact digests
            // through both virtual (zero emitted files) and physical cuts.
            const virtualDest = join(destination, 'never-created-virtual-cut');
            const virtualCut = scaffoldIntegrationRepos(resolve('Aurekai'), { outDir: virtualDest, mode: 'virtual' });
            if (existsSync(virtualDest)) throw Error('Virtual integration cut materialized files');
            if (virtualCut.count !== index.count) throw Error('Virtual cut lost integration targets');
            const checked = scaffoldIntegrationRepos(resolve('Aurekai'), { outDir: destination, mode: 'verify' });
            if (checked.recipe_sha256 !== virtualCut.recipe_sha256) {
              throw Error('Virtual and physical regeneration differ in byte-level recipe');
            }
            const scoped = scaffoldIntegrationRepos(resolve('Aurekai'), {
              outDir: virtualDest, mode: 'virtual', target: virtualCut.repos[0].slug
            });
            if (scoped.count !== 1 || scoped.repos[0].slug !== virtualCut.repos[0].slug || existsSync(virtualDest)) {
              throw Error('Scoped virtual integration cut expanded or mutated');
            }
            // Exercise the actual public akai front door without installing
            // the production runtime or exporting generated artifacts.
            const moduleDir = resolve('Aurekai/node_modules/@aurekai');
            mkdirSync(moduleDir, { recursive: true });
            symlinkSync(resolve('Aurekai/kernel'), join(moduleDir, 'continuity-core'), 'dir');
            const akai = resolve('Aurekai/bin/akai.mjs');
            const cli = (...args) => spawnSync(process.execPath, [akai, 'integrate:scaffold-repos', ...args],
              { encoding: 'utf8' });
            const viaCli = cli('--target', scoped.repos[0].slug,
              '--out-dir', virtualDest, '--virtual', '--json');
            if (viaCli.status !== 0) throw Error('akai virtual scaffold failed: ' + viaCli.stderr);
            const readback = JSON.parse(viaCli.stdout);
            if (readback.mode !== 'virtual' || readback.recipe_sha256 !== scoped.recipe_sha256 ||
                existsSync(virtualDest)) throw Error('akai virtual route changed or materialized output');
            const cannotMix = cli('--target', scoped.repos[0].slug, '--virtual', '--verify');
            if (cannotMix.status !== 2) throw Error('akai accepted conflicting scaffold modes');
            if (existsSync('Aurekai/generated/integration-repos')) throw Error('Generator wrote into tracked checkout');
            console.log('Verified ' + index.count + ' exact virtual-to-physical template cuts plus akai virtual routing');
          } finally {
            rmSync(destination, { recursive: true, force: true });
          }
          JS
      - name: Verify one policy cut per batch with exact target parity
        run: node --test Aurekai/tests/integration-batch-parity.test.mjs
      - name: Verify connector fan-out reuses owner inputs without changing receipts
        run: node --test Aurekai/tests/integration-ingest-batch-parity.test.mjs
      - name: Verify atlas reflects pinned Git modules and URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          catalog = Path("site/modules/index.html").read_text(encoding="utf-8")
          listed = re.findall(r'data-path="([^"]+)" data-pin="([0-9a-f]{40})"', catalog)
          pins = dict(listed)
          if len(listed) != len(pins):
              raise SystemExit("Duplicate atlas path")
          rows = subprocess.check_output(
              ["git", "config", "-f", ".gitmodules", "--get-regexp", r"^submodule\..*\.path$"],
              text=True,
          ).splitlines()
          expected = {}
          for line in rows:
              _, path = line.split(" ", 1)
              tree = subprocess.check_output(["git", "ls-tree", "HEAD", "--", path], text=True).strip()
              match = re.fullmatch(r"160000 commit ([0-9a-f]{40})\t(.+)", tree)
              if not match or match.group(2) != path:
                  raise SystemExit(f"Not a pinned Gitlink: {path}")
              expected[path] = match.group(1)
          # The visible PIN label and its source URL must agree with the
          # Gitlink; updating only data-pin once left a stale human label.
          blocks = re.findall(r'<article class="module".*?</article>', catalog, re.S)
          if len(blocks) != len(expected):
              raise SystemExit("Source atlas module rows are missing or duplicated")
          for block in blocks:
              marker = re.search(r'data-path="([^"]+)" data-pin="([0-9a-f]{40})"', block)
              shown = re.search(r'>PIN ([0-9a-f]{12}) ↗</a>', block)
              if not marker or not shown or shown.group(1) != marker.group(2)[:12]:
                  raise SystemExit("Source atlas has a stale visible PIN label")
              path, pin = marker.groups()
              submodule_url = subprocess.check_output(
                  ["git", "config", "-f", ".gitmodules", f"submodule.{path}.url"], text=True
              ).strip()
              if submodule_url.endswith(".git"):
                  submodule_url = submodule_url[:-4]
              if f'href="{submodule_url}/tree/{pin}"' not in block:
                  raise SystemExit(f"Source atlas pinned URL mismatch: {path}")
          if pins != expected:
              missing = sorted(set(expected) - set(pins))
              extra = sorted(set(pins) - set(expected))
              drift = sorted(p for p in pins.keys() & expected.keys() if pins[p] != expected[p])
              raise SystemExit(f"Stale atlas; missing={missing}, extra={extra}, drift={drift}")
          manifest_sha = subprocess.check_output(["git", "hash-object", ".gitmodules"], text=True).strip()
          if f'<meta name="bonfyre-manifest-sha" content="{manifest_sha}">' not in catalog:
              raise SystemExit("Atlas does not match manifest blob")
          print(f"Verified {len(expected)} pinned repositories, manifest {manifest_sha[:12]}")
          PY
