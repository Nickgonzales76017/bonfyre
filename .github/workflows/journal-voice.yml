name: Aurekai Journal Voice Audition
on:
  push:
    branches: [main]
    paths: ['.github/workflows/journal-voice.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install open neural speech runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
          python -m pip install 'kokoro-onnx==0.6.1' 'soundfile==0.13.1'
      - uses: actions/cache@v4
        with:
          path: .voice-cache
          key: journal-kokoro-fp16-v1.1
      - name: Download and hash open-weight model
        run: |
          set -euo pipefail
          mkdir -p .voice-cache editorial/audio/auditions
          base='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1'
          test -s .voice-cache/kokoro-v1.0.fp16.onnx || curl -fL --retry 3 "$base/kokoro-v1.0.fp16.onnx" -o .voice-cache/kokoro-v1.0.fp16.onnx
          test -s .voice-cache/voices-v1.0.bin || curl -fL --retry 3 "$base/voices-v1.0.bin" -o .voice-cache/voices-v1.0.bin
          test "$(wc -c < .voice-cache/kokoro-v1.0.fp16.onnx)" -gt 100000000
          test "$(wc -c < .voice-cache/voices-v1.0.bin)" -gt 10000000
          sha256sum .voice-cache/* > editorial/audio/auditions/model-hashes.txt
      - name: Generate samples from three Journal essays in three voices
        timeout-minutes: 35
        run: |
          python - <<'PY'
          import hashlib,json,re,subprocess
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          from kokoro_onnx import Kokoro
          out=Path('editorial/audio/auditions')
          tts=Kokoro('.voice-cache/kokoro-v1.0.fp16.onnx','.voice-cache/voices-v1.0.bin')
          records=[]
          try:
            for slug in ['sites-are-dead-long-live-the-web','the-machine-told-me-so','who-keeps-the-internet-alive']:
              raw=Path('editorial/posts',slug+'.md').read_text()
              header,body=raw.split('\n---\n',1)
              title=re.search(r'(?m)^title: (.+)$',header).group(1).strip()
              paragraphs=[]
              for p in re.split(r'\n\s*\n',body):
                if p.lstrip().startswith(('![','- ','> ')) or len(p.split())<9:continue
                p=re.sub(r'^#{1,4}\s+','',p.strip())
                p=re.sub(r'\[([^\]]+)\]\(https?://[^)]+\)',r'\1',p)
                p=re.sub(r'https?://\S+','',p).replace('**','')
                paragraphs.append(' '.join(p.split()))
                if sum(len(x.split()) for x in paragraphs)>95:break
              text=title+'. '+' '.join(paragraphs)
              if len(text)<190:raise RuntimeError('Insufficient source prose')
              chunks=[];part=''
              for word in text.split():
                if part and len(part)+len(word)+1>210:
                  chunks.append(part);part=''
                part+=(' ' if part else '')+word
              if part:chunks.append(part)
              for voice in ['af_heart','af_sarah','am_michael']:
                sections=[]
                for passage in chunks:
                  a,sr=tts.create(passage,voice=voice,speed=.96,lang='en-us')
                  if sr!=24000:raise RuntimeError('Invalid sample rate')
                  sections.extend([np.asarray(a,dtype=np.float32).reshape(-1),np.zeros(4800,dtype=np.float32)])
                pcm=np.concatenate(sections)
                seconds=len(pcm)/24000
                rms=float(np.sqrt(np.mean(np.square(pcm.astype(np.float64)))))
                if seconds<15 or rms<.003 or float(np.max(np.abs(pcm)))>=1.2:raise RuntimeError('Speech QA failed')
                name=slug+'-'+voice
                wav=out/(name+'.wav')
                mp3=out/(name+'.mp3')
                sf.write(str(wav),np.clip(pcm,-1,1),24000)
                subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y','-i',str(wav),
                  '-af','loudnorm=I=-16:TP=-1.5:LRA=11','-ar','24000','-ac','1',
                  '-c:a','libmp3lame','-b:a','80k',str(mp3)],check=True)
                wav.unlink()
                if mp3.stat().st_size<50000:raise RuntimeError('Empty output audio')
                info=dict(article=slug,voice=voice,seconds=round(seconds,1),rms=round(rms,4),
                  text_sha256=hashlib.sha256(text.encode()).hexdigest(),
                  audio_sha256=hashlib.sha256(mp3.read_bytes()).hexdigest(),file=mp3.name)
                records.append(info)
                print(json.dumps(info),flush=True)
          finally:
            tts.voices.close()
          if len(records)!=9:raise RuntimeError('Incomplete audition')
          (out/'manifest.json').write_text(json.dumps(dict(model='Kokoro-82M v1.0',
            license='Apache-2.0',review='audition only; not a published narration',samples=records),indent=2))
          print('VOICE_AUDITION_PASS 9 source-grounded neural-voice MP3 recordings')
          PY
      - name: Retain audition audio for review
        uses: actions/upload-artifact@v4
        with:
          name: aurekai-journal-voice-auditions
          path: editorial/audio/auditions/
          retention-days: 30
