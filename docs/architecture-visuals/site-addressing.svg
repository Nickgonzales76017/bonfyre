<svg xmlns="http://www.w3.org/2000/svg" width="1508" height="790" viewBox="0 0 1508 790" role="img" aria-labelledby="title description"><title id="title">Aurekai account, sites and address architecture</title><desc id="description">One organization or account owns multiple composed sites: a business site, private client portal and publication. Bonfÿre WebAddress and Matrix resolve the verified host and path to the allowed site experience. Delivery may use an Aurekai subdomain, verified custom domain or approved external host.</desc><rect x="15" y="15" width="1478" height="760" rx="32" fill="#fafbf9" stroke="#dce2dc" stroke-width="1.8"/>
