<svg xmlns="http://www.w3.org/2000/svg" width="1508" height="750" viewBox="0 0 1508 750" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">One source, many installed applications</title><desc id="diagram-desc">A retained item keeps its publisher and occurrence identity. A typed feed-use projection makes continuations available only to installed applications with matching declared intake and permissions: CRM, creator narration, or collection and publication.</desc><rect x="15" y="15" width="1478" height="720" rx="32" fill="#fafbf9" stroke="#dce2dc" stroke-width="2"/><text x="754" y="86" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="34" font-weight="640" fill="#1f2922">One source, many installed applications</text><text x="754" y="132" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#6b786e">Identity stays with the original source; each application owns its continuation</text><rect x="80" y="170" width="1348" height="105" rx="22" fill="#fff" stroke="#dae2d9" stroke-width="2"/><text x="754" y="218" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#1f2922">Source Library · retained item and provenance</text><text x="754" y="251" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#829185">Publisher, occurrence, semantics and source address</text><path d="M754 288V331m-8 0 8 9 8-9" fill="none" stroke="#6f8471" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="355" width="1348" height="100" rx="22" fill="#f0f6ee" stroke="#dae2d9" stroke-width="2"/><text x="754" y="397" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#1f2922">Typed feed-use → installed application intake</text><text x="754" y="432" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#657569">Capability declarations + account scope + authority</text><path d="M754 469V503m-8 0 8 9 8-9" fill="none" stroke="#6f8471" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="535" width="453" height="158" rx="22" fill="#fff" stroke="#dae2d9" stroke-width="2"/><text x="266" y="605" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="600" fill="#1f2922">CRM</text><text x="266" y="641" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#7d8c80">Relationship / opportunity</text><text x="266" y="665" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#7d8c80">Application-owned records</text><rect x="516" y="535" width="453" height="158" rx="22" fill="#fff" stroke="#dae2d9" stroke-width="2"/><text x="742" y="605" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="600" fill="#1f2922">Creator narration</text><text x="742" y="641" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#7d8c80">Audio / editorial edition</text><text x="742" y="665" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#7d8c80">Review-gated output</text><rect x="992" y="535" width="453" height="158" rx="22" fill="#fff" stroke="#dae2d9" stroke-width="2"/><text x="1218" y="605" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="600" fill="#1f2922">Collections and reading</text><text x="1218" y="641" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#7d8c80">Bookmarks / publications</text><text x="1218" y="665" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#7d8c80">Source referenced, not copied</text><text x="754" y="725" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#708075">A continuation is not a duplicate source or permission to write</text></svg>