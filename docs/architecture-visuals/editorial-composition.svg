<svg xmlns="http://www.w3.org/2000/svg" width="1508" height="750" viewBox="0 0 1508 750" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Unified editorial authoring and publication</title><desc id="diagram-desc">Design, structure and article editors compose a shared authored page. Native CMS retains pages and fragments. Review and authorization gate publication before public profile, journal and optional narration/distribution views.</desc><rect x="15" y="15" width="1478" height="720" rx="32" fill="#fafbf9" stroke="#dce2dc" stroke-width="2"/><text x="754" y="88" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="35" font-weight="640" fill="#1f2922">Unified editorial authoring</text><text x="754" y="129" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#66766a">One composed document, multiple editing modes and publication destinations</text><rect x="40" y="176" width="453" height="158" rx="22" fill="#fff" stroke="#dae2d9" stroke-width="2"/><text x="266" y="246" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#1f2922">Design</text><text x="266" y="282" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#7d8c80">Visual layout</text><text x="266" y="306" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#7d8c80">GrapesJS</text><rect x="516" y="176" width="453" height="158" rx="22" fill="#fff" stroke="#dae2d9" stroke-width="2"/><text x="742" y="246" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#1f2922">Structure</text><text x="742" y="282" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#7d8c80">Components + responsive</text><text x="742" y="306" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#7d8c80">Puck</text><rect x="992" y="176" width="453" height="158" rx="22" fill="#fff" stroke="#dae2d9" stroke-width="2"/><text x="1218" y="246" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#1f2922">Article</text><text x="1218" y="282" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#7d8c80">Long-form rich content</text><text x="1218" y="306" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#7d8c80">Editor.js</text><path d="M754 345V378m-8 0 8 9 8-9" fill="none" stroke="#6f8471" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="402" width="1348" height="116" rx="22" fill="#f0f6ee" stroke="#dae2d9" stroke-width="2"/><text x="754" y="451" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="620" fill="#1f2922">BonfÿreCMS · site_page + site_fragment</text><text x="754" y="488" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#6f8073">Typed composition · revision · audience · source evidence · review</text><path d="M754 529V554m-8 0 8 9 8-9" fill="none" stroke="#6f8471" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="565" width="453" height="158" rx="22" fill="#fff" stroke="#dae2d9" stroke-width="2"/><text x="266" y="635" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="600" fill="#1f2922">Profile + journal</text><text x="266" y="671" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#7d8c80">Published reading surface</text><rect x="516" y="565" width="453" height="158" rx="22" fill="#fff" stroke="#dae2d9" stroke-width="2"/><text x="742" y=