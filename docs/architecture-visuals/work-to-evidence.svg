<svg xmlns="http://www.w3.org/2000/svg" width="1508" height="750" viewBox="0 0 1508 750" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Work, execution and evidence architecture</title><desc id="diagram-desc">WorkGraph and CapabilityClosure assemble admissible work. Authority and EffectKernel gate effects. Native commands, local models, bounded agents and human work realize actions, producing receipts, witnesses and evidence for reviewed promotions.</desc><rect x="15" y="15" width="1478" height="720" rx="32" fill="#fafbf9" stroke="#dce2dc" stroke-width="2"/><text x="754" y="86" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="34" font-weight="640" fill="#1f2922">Work → execution → evidence</text><text x="754" y="131" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#6b786e">Shared capabilities are admitted and proven, not inferred from installed tools</text><rect x="80" y="171" width="1348" height="104" rx="22" fill="#fff" stroke="#dae2d9" stroke-width="2"/><text x="754" y="218" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="620" fill="#1f2922">WorkGraph + CapabilityClosure</text><text x="754" y="252" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#829185">Tasks · dependencies · contracts · available realizations</text><path d="M754 290V329m-8 0 8 9 8-9" fill="none" stroke="#6f8471" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="355" width="1348" height="102" rx="22" fill="#f0f6ee" stroke="#dae2d9" stroke-width="2"/><text x="754" y="399" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="620" fill="#1f2922">Authority + EffectKernel</text><text x="754" y="435" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" 