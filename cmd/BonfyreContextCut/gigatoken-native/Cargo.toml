[package]
name = "bonfyre-gigatoken-native"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
aho-corasick = "1.1"
arrow-array = "59"
arrow-schema = "59"
base64 = "0.22"
dashmap = "6.1"
eyre = "0.6.12"
flate2 = "1.1"
icu = { version = "2.2", features = ["compiled_data", "datagen"] }
indicatif = "0.18"
itertools = "0.15"
memchr = "2.8.0"
memmap2 = { version = "0.9", features = ["stable_deref_trait"] }
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "snap", "zstd", "flate2", "lz4", "brotli", "flate2-rust_backend"] }
priority-queue = "2.0"
rayon = "1.11"
rustc-hash = "2.1"
serde = { version = "1.0.228", features = ["derive"] }
simdutf = "0.7.0"
sonic-rs = "0.5.8"
spm_precompiled = "0.1.4"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
winnow = { version = "1", features = ["simd"] }
zstd = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "fat"

[lints.rust]
unused = "allow"
