<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d"><title id="t">Making a page is not the same as making a place</title><desc id="d">Conceptual comparison. Useful expression includes relationships, tools, and continuity.</desc><rect width="1200" height="700" fill="#e8e4d8"/><path d="M0 121H1200M0 622H1200" stroke="#b0b7a8"/><rect x="22" y="22" width="1156" height="656" fill="none" stroke="#bbc1b2"/><path d="M36 35h18m-9 -9v18 M1146 655h18m-9 -9v18" stroke="#b96646"/><text x="62" y="68" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="750" letter-spacing="2.3" fill="#96563b">AUREKAI JOURNAL · VISUAL ARGUMENT 03</text><text x="62" y="103" font-family="system-ui,Arial,sans-serif" font-size="31" font-weight="650" fill="#213f33">Making a page is not the same as making a place</text><rect x="66" y="225" width="365" height="112" rx="7" fill="#ad6040" stroke="#bcbcad" stroke-width="1.5"/><text x="88" y="254" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="750" fill="#d8b99e">AN OUTPUT</text><text x="88" y="290" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="650" fill="#f8f3e6">Generate → publish</text><text x="88" y="316" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="400" fill="#f8f3e6">One artifact, then what?</text><path d="M443 281 L568 281" stroke="#aa6d4b" stroke-width="3" stroke-dasharray="8 8" fill="none"/><circle cx="605" cy="280" r="58" fill="#183d32" stroke="#d8bf98" stroke-width="2"/><text x="566" y="287" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="700" fill="#fff9e6">TOOLS</text><path d="M663 280 L731 210" stroke="#a26d4c" stroke-width="3"  fill="none"/><path d="M663 280 L731 361" stroke="#a26d4c" stroke-width="3"  fill="none"/><path d="M663 280 L731 497" stroke="#a26d4c" stroke-width="3"  fill="none"/><rect x="744" y="144" width="383" height="110" rx="7" fill="#f7f3e9" stroke="#bcbcad" stroke-width="1.5"/><text x="766" y="173" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="750" fill="#8c5b43">MAKE</text><text x="766" y="209" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="650" fill="#173e31">A collection</text><text x="766" y="235" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="400" fill="#173e31">Records, knowledge, reuse</text><rect x="744" y="310" width="383" height="110" rx="7" fill="#f7f3e9" stroke="#bcbcad" stroke-width="1.5"/><text x="766" y="339" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="750" fill="#8c5b43">BELONG</text><text x="766" y="375" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="650" fill="#173e31">A community</text><text x="766" y="401" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="400" fill="#173e31">Members, rules, participation</text><rect x="744" y="474" width="383" height="110" rx="7" fill="#f7f3e9" stroke="#bcbcad" stroke-width="1.5"/><text x="766" y="503" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="750" fill="#8c5b43">SUSTAIN</text><text x="766" y="539" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="650" fill="#173e31">A working service</text><text x="766" y="565" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="400" fill="#173e31">Operations, rights, support</text><text x="62" y="659" font-family="system-ui,Arial,sans-serif" font-size="15" fill="#4b6358">Conceptual comparison. Useful expression includes relationships, tools, and continuity.</text><text x="1134" y="660" text-anchor="end" font-family="Georgia,serif" font-size="37" fill="#b96646">03</text></svg>