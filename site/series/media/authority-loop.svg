<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d"><title id="t">Correct work can serve a wrong goal</title><desc id="d">Conceptual model. Arrows describe a failure mode, not observed behavior.</desc><rect width="1200" height="700" fill="#e8e4d8"/><path d="M0 121H1200M0 622H1200" stroke="#b0b7a8"/><rect x="22" y="22" width="1156" height="656" fill="none" stroke="#bbc1b2"/><path d="M36 35h18m-9 -9v18 M1146 655h18m-9 -9v18" stroke="#c76a49"/><text x="62" y="68" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="750" letter-spacing="2.3" fill="#96563b">AUREKAI JOURNAL · VISUAL ARGUMENT 01</text><text x="62" y="103" font-family="system-ui,Arial,sans-serif" font-size="31" font-weight="650" fill="#213f33">Correct work can serve a wrong goal</text><rect x="65" y="183" width="300" height="112" rx="7" fill="#f7f3e9" stroke="#bcbcad" stroke-width="1.5"/><text x="87" y="212" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="750" fill="#8c5b43">1 / BRIEF</text><text x="87" y="248" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="650" fill="#173e31">A task is assigned</text><text x="87" y="274" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="400" fill="#173e31">A plausible target is chosen</text><rect x="65" y="354" width="300" height="112" rx="7" fill="#f7f3e9" stroke="#bcbcad" stroke-width="1.5"/><text x="87" y="383" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="750" fill="#8c5b43">2 / CHECK</text><text x="87" y="419" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="650" fill="#173e31">The result passes</text><text x="87" y="445" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="400" fill="#173e31">The test matches the brief</text><path d="M215 295 L215 352" stroke="#9b684b" stroke-width="4"  fill="none"/><path d="M209 341l6 12 6-12" fill="#9b684b"/><circle cx="450" cy="327" r="43" fill="#ad6040" stroke="#d8bf98" stroke-width="2"/><text x="427" y="334" font-family="system-ui,Arial,sans-serif" font-size="34" font-weight="700" fill="#fffdf6">?</text><path d="M365 406 L425 343" stroke="#ab6950" stroke-width="3"  fill="none"/><path d="M493 325 L600 325" stroke="#ab6950" stroke-width="3"  fill="none"/><rect x="607" y="191" width="526" height="122" rx="7" fill="#183d32" stroke="#588270" stroke-width="1.5"/><text x="629" y="220" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="750" fill="#d8b99e">INDEPENDENT QUESTION</text><text x="629" y="256" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="650" fill="#f8f3e6">Should this work exist?</text><text x="629" y="282" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="400" fill="#f8f3e6">A person can challenge the premise</text><rect x="607" y="386" width="526" height="122" rx="7" fill="#183d32" stroke="#588270" stroke-width="1.5"/><text x="629" y="415" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="750" fill="#d8b99e">REAL-WORLD FEEDBACK</text><text x="629" y="451" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="650" fill="#f8f3e6">Did it achieve the purpose?</text><text x="629" y="477" font-family="system-ui,Arial,sans-serif" font-size="16" font-weight="400" fill="#f8f3e6">Effects matter beyond test completion</text><path d="M870 313 L870 385" stroke="#607b68" stroke-width="4"  fill="none"/><path d="M864 375l6 13 6-13" fill="#607b68"/><text x="62" y="659" font-family="system-ui,Arial,sans-serif" font-size="15" fill="#4b6358">Conceptual model. Arrows describe a failure mode, not observed behavior.</text><text x="1134" y="660" text-anchor="end" font-family="Georgia,serif" font-size="37" fill="#c76a49">01</text></svg>