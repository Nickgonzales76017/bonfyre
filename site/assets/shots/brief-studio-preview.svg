</text><text x="556" y="241" fill="#1d3927" font-size="32" font-family="Georgia,serif">this opportunity?</text><rect x="556" y="267" width="316" height="2" fill="#b4c8b5"/><text x="556" y="308" fill="#506658" font-family="sans-serif" font-size="17">Decision: hold pending checks</text><text x="556" y="351" fill="#506658" font-family="sans-serif" font-size="17">Illustrative cost comparison</text><text x="556" y="403" fill="#1d3927" font-family="sans-serif" font-size="36">$80.00</text><text x="556" y="445" fill="#506658" font-family="sans-serif" font-size="16">4 questions · 4 proposed methods</text><rect x="556" y="468" width="318" height="26" rx="4" fill="#dbe2d4"/><text x="567" y="487" fill="#385243" font-family="sans-serif" font-size="13">Proposal only · no vendor dispatched</text></svg>