<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Research Room · Aurekai</title><style>
:root{color-scheme:dark;font:15px/1.5 system-ui;background:#0d1318;color:#e7eff1}*{box-sizing:border-box}body{margin:0}header{padding:24px max(20px,5vw);border-bottom:1px solid #30434b;display:flex;justify-content:space-between;gap:20px;align-items:center}a{color:#a5e3d6}main{max-width:1360px;margin:auto;padding:28px 3vw}h1{font-size:clamp(28px,3vw,45px);margin:5px 0}h2{font-size:20px;margin:0 0 14px}p,small{color:#abbec5}.eyebrow{font:12px monospace;letter-spacing:.13em;color:#75dabc}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button,.button{background:#203640;border:1px solid #46636b;color:#eef9f8;border-radius:7px;padding:11px 14px;cursor:pointer;font:inherit}button:hover{border-color:#91dfcd}button.active,.primary{background:#b5edcf;color:#0c2119}button:disabled{opacity:.4;cursor:not-allowed}input,textarea,select{background:#101f26;color:#f1f6f6;border:1px solid #46636b;border-radius:6px;padding:10px;width:100%;font:inherit}textarea{min-height:135px;resize:vertical}label{display:block;font-size:13px;color:#c1d7dc;margin:12px 0}.layout{display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:18px}.panel{background:#13232b;border:1px solid #304851;border-radius:12px;padding:20px;margin-bottom:16px}.record{padding:14px;border:1px solid #36535d;border-radius:9px;margin:10px 0}.record.selected{border-color:#b5edcf}.muted{color:#9bb5be}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.steps{display:flex;gap:7px;flex-wrap:wrap}.steps span{padding:6px 10px;border:1px solid #38515a;border-radius:5px;font-size:12px}.steps span.done{border-color:#76c7a2;color:#a6edd0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}blockquote{margin:10px 0;padding:10px 14px;border-left:3px solid #7cc4ab;background:#182f36;white-space:pre-wrap}#notice{color:#efca84;min-height:24px}@media(max-width:820px){.layout,.cols{grid-template-columns:1fr}}</style></head>
<body><header><div><div class="eyebrow">AUREKAI / CUSTOMER VOICE / RESEARCH ROOM</div><h1>From a conversation to a decision</h1><p>Retain source context. Review verbatim passages. Accept, reject, or defer each finding before publishing a research brief.</p></div><a href="../">← Observatory</a></header><main><div class="steps" id="steps"></div><nav id="tabs"></nav><div class="layout"><aside><section class="panel"><h2>Source library</h2><div id="sources"></div><button id="newSource">+ Add source</button></section><section class="panel"><h2>Research progress</h2><div id="progress"></div></section></aside><section class="panel"><div id="workspace"></div><p id="notice" role="status"></p></section></div></main>
<script type="module">
const KEY="aurekai.voice.research.v1",chapters=["Sources","Extract","Review","Synthesize","Publish"];
const blank=()=>({sources:[],findings:[],project:"Customer discovery",revision:0,published:null});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||blank()}catch{state=blank()}
if(!Array.isArray(state.sources)||!Array.isArray(state.findings))state=blank();
let page=0,selected=null;const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID?.()||String(Date.now())+Math.random();
function store(){state.revision++;localStorage.setItem(KEY,JSON.stringify(state));render()}
function toast(s){$("#notice").textContent=s}
function source(id){return state.sources.find(x=>x.id===id)}
function quoteValid(f){const s=source(f.sourceId);return !!s&&!!f.quote?.trim()&&s.text.includes(f.quote)}
function ready(){return state.findings.some(f=>f.status==="accepted"&&quoteValid(f))&&state.findings.every(f=>f.status!=="accepted"||quoteValid(f))}
function stepDone(i){return [state.sources.length>0,state.findings.length>0,state.findings.some(f=>f.status!=="pending"),ready(),!!state.published&&state.published.revision===state.revision][i]}
function addSource(name,text,url=""){name=name.trim();text=text.trim();if(!name||!text)return toast("A named source and original text are required.");const id=uid();state.sources.push({id,name,text,url,created:new Date().toISOString()});selected=id;state.published=null;store()}
function exportFile(name,body,type){const a=document.createElement("a"),u=URL.createObjectURL(new Blob([body],{type}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function brief(){const accepted=state.findings.filter(f=>f.status==="accepted"&&quoteValid(f));return ["# "+state.project,"","Research draft — acceptance denotes analyst review, not independent verification.","","## Accepted findings",...accepted.flatMap(f=>["","### "+f.theme,"Finding: "+f.interpretation,"> "+f.quote.replaceAll("\n","\n> "),"Source: "+source(f.sourceId).name+(source(f.sourceId).url?" — "+source(f.sourceId).url:""),"Decision: "+(f.action||"No follow-up specified")]),"","## Review trail",...state.findings.map(f=>"- "+f.status.toUpperCase()+": "+f.theme+" / "+(source(f.sourceId)?.name||"missing source")),"","Generated "+new Date().toISOString()].join("\n")}
function render(){const accepted=state.findings.filter(f=>f.status==="accepted"&&quoteValid(f)).length;$("#steps").innerHTML=chapters.map((c,i)=>'<span class="'+(stepDone(i)?"done":"")+'">'+(stepDone(i)?"✓ ":"○ ")+esc(c)+'</span>').join("");$("#tabs").innerHTML=chapters.map((c,i)=>'<button data-tab="'+i+'" class="'+(i===page?"active":"")+'">'+esc(c)+'</button>').join("");$("#sources").innerHTML=state.sources.map(s=>'<button style="width:100%;margin:3px 0;text-align:left" data-source="'+esc(s.id)+'">'+esc(s.name)+' <small>('+s.text.length+' chars)</small></button>').join("")||'<p>No imported material yet.</p>';$("#progress").innerHTML='<p>'+state.sources.length+' sources · '+state.findings.length+' findings · '+accepted+' accepted with traceable quotes</p><p>Saved locally at revision '+state.revision+'. Publication is an export; no live customer records are changed.</p>';const w=$("#workspace");
if(page===0){w.innerHTML='<h2>1 / Import original material</h2><p>Paste a transcript or interview notes, or import a text file. No automatic sentiment claims. Source text stays intact for quote matching.</p><label>Research project<input id="project" value="'+esc(state.project)+'"></label><label>Source name<input id="sourceName" placeholder="Interview — 2026-10-15"></label><label>Source URL (optional)<input id="sourceUrl" type="url" placeholder="https://…"></label><label>Original transcript or notes<textarea id="sourceText" placeholder="Paste original source text"></textarea></label><label>Import .txt / .md file<input id="sourceFile" type="file" accept=".txt,.md,text/plain,text/markdown"></label><div class="toolbar"><button class="primary" id="saveSource">Add to library</button><button id="next">Next: identify findings →</button></div>'}
if(page===1){const s=source(selected)||state.sources[0];w.innerHTML='<h2>2 / Extract a traceable observation</h2><p>Copy an exact passage from the original. A finding cannot be accepted if its quote does not exist in the selected source.</p><label>Source<select id="findingSource">'+state.sources.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===s?.id?"selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select></label>'+(s?'<div class="record"><strong>Original source</strong><blockquote>'+esc(s.text.slice(0,14000))+'</blockquote></div>':'<p>Add a source first.</p>')+'<label>Exact quote<textarea id="quote"></textarea></label><label>Theme<input id="theme" placeholder="Unmet need / recurring friction"></label><label>Interpretation (analyst hypothesis)<textarea id="interpretation"></textarea></label><label>Proposed follow-up<input id="action" placeholder="Prototype, interview, measure…"></label><div class="toolbar"><button class="primary" id="saveFinding">Save observation</button><button id="next">Review findings →</button></div>'}
if(page===2){w.innerHTML='<h2>3 / Editorial decisions</h2><p>Accept, reject, or defer individually. Review status is not evidence of truth. The original passage remains attached.</p>'+state.findings.map(f=>'<article class="record"><strong>'+esc(f.theme)+'</strong> · '+esc(f.status)+'<p>'+esc(f.interpretation)+'</p><blockquote>'+esc(f.quote)+'</blockquote><small>'+esc(source(f.sourceId)?.name||"Source removed")+(quoteValid(f)?" · Exact quote matched":" · QUOTE NOT FOUND")+'</small><div class="toolbar">'+["accepted","rejected","deferred"].map(s=>'<button data-review="'+esc(f.id)+'" data-status="'+s+'" '+(s==="accepted"&&!quoteValid(f)?"disabled":"")+'>'+s+'</button>').join("")+'</div></article>').join("")+'<button id="next">Prepare synthesis →</button>'}
if(page===3){w.innerHTML='<h2>4 / Synthesis</h2><p>'+accepted+' reviewed, source-matched finding(s). Rejected and deferred observations stay in the review trail, not the published conclusions.</p><div class="record"><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(brief())+'</pre></div><div class="toolbar"><button id="downloadDraft">Download draft .md</button><button id="next" '+(!ready()?"disabled":"")+' class="primary">Publish reviewed export →</button></div>'}
if(page===4){w.innerHTML='<h2>5 / Publish a controlled handoff</h2><p>Publishing freezes the current brief as a local reviewed snapshot and makes it downloadable. It does not pretend to send data to a CMS, issue tracker, or customer.</p><div class="toolbar"><button id="publish" '+(!ready()?"disabled":"")+' class="primary">Approve snapshot</button><button id="downloadPublished" '+(!state.published?"disabled":"") +'>Download approved .md</button><button id="downloadAudit">Export source + decision audit</button></div>'+(state.published?'<p>Snapshot approved '+esc(state.published.at)+' · source revision '+state.published.revision+'</p>':'<p>No approved snapshot.</p>')}
$("#tabs").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{page=+b.dataset.tab;render()});$("#sources").querySelectorAll("[data-source]").forEach(b=>b.onclick=()=>{selected=b.dataset.source;page=1;render()});$("#newSource").onclick=()=>{page=0;render()};
$("#next")?.addEventListener("click",()=>{page=Math.min(4,page+1);render()});
$("#saveSource")?.addEventListener("click",()=>{state.project=$("#project").value.trim()||state.project;addSource($("#sourceName").value,$("#sourceText").value,$("#sourceUrl").value)});
$("#sourceFile")?.addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;if(f.size>2e6)return toast("Limit: 2 MB per text file.");$("#sourceName").value=f.name;$("#sourceText").value=await f.text()});
$("#findingSource")?.addEventListener("change",e=>{selected=e.target.value;render()});
$("#saveFinding")?.addEventListener("click",()=>{const id=$("#findingSource").value,quote=$("#quote").value.trim(),theme=$("#theme").value.trim(),interpretation=$("#interpretation").value.trim();if(!source(id)?.text.includes(quote)||!quote||!theme||!interpretation)return toast("Provide a source-matched exact quote, theme, and interpretation.");state.findings.push({id:uid(),sourceId:id,quote,theme,interpretation,action:$("#action").value.trim(),status:"pending"});state.published=null;page=2;store()});
w.querySelectorAll("[data-review]").forEach(b=>b.onclick=()=>{const f=state.findings.find(x=>x.id===b.dataset.review);if(!f||b.dataset.status==="accepted"&&!quoteValid(f))return;f.status=b.dataset.status;state.published=null;store()});
$("#downloadDraft")?.addEventListener("click",()=>exportFile("customer-voice-draft.md",brief(),"text/markdown"));
$("#publish")?.addEventListener("click",()=>{if(!ready())return;state.published={body:brief(),revision:state.revision+1,at:new Date().toISOString()};store()});
$("#downloadPublished")?.addEventListener("click",()=>{if(state.published)exportFile("customer-voice-approved.md",state.published.body,"text/markdown")});
$("#downloadAudit")?.addEventListener("click",()=>exportFile("customer-voice-audit.json",JSON.stringify({sources:state.sources,findings:state.findings,publication:state.published},null,2),"application/json"));
}render();
</script></body></html>
