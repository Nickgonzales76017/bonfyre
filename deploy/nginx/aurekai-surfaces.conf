# Public domain carrier: nginx remains transport-only.  The Matrix service owns
# semantic host/path resolution; bonfyred remains the established native app
# for deep operational surfaces until each becomes an explicit Matrix route.
map $http_upgrade $aurekai_conn { default upgrade; '' close; }

# Client-estate hosts are not public Matrix territories.  Keep this map at the
# edge solely to pass a fixed host→institution selector to the native auth
# owner; it is not a routing table and it never grants authority by hostname.
map $host $bonfyre_institution {
    default "";
    upper90.aurekai.work upper90;
    jrss.aurekai.work jrss;
    ai-loss.aurekai.work ai-loss;
    leads.aurekai.work leads;
}

# Client hosts do not redirect from plaintext HTTP: an HTTP redirect is still
# a public discovery response, and it advertises a private estate to scanners
# before the authenticated HTTPS gate can refuse it.
server {
    listen 80;
    listen [::]:80;
    server_name upper90.aurekai.work jrss.aurekai.work ai-loss.aurekai.work leads.aurekai.work;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name aurekai.work www.aurekai.work

                *.aurekai.work
                aurekai.live www.aurekai.live
                *.aurekai.live
                aurekai.shop www.aurekai.shop
                *.aurekai.shop
                aurekai.life www.aurekai.life
                *.aurekai.life
                theleaflounge.store www.theleaflounge.store
                *.theleaflounge.store;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # Apex and www only. The wildcard certificate does not carry these names.
    server_name aurekai.work www.aurekai.work
                aurekai.live www.aurekai.live
                aurekai.shop www.aurekai.shop
                aurekai.life www.aurekai.life
                theleaflounge.store www.theleaflounge.store;

    ssl_certificate /etc/letsencrypt/live/bonfyre-matrix/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bonfyre-matrix/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/bonfyre-public-estate.conf;
}

# Every institution host, including the ones that do not exist yet.
#
# S12: Aurekai users create institutions, not applications. An institution is a
# host. Until this block existed, a host the enumerated certificate had never
# heard of failed TLS before the Matrix edge could resolve the name -- so
# creating an institution meant reissuing a certificate, which is not a thing
# an end user can do. The wildcard certificate already covered them; only the
# selection was missing.
#
# Exact names beat wildcards in nginx, so the delegated client estates below
# keep their own authenticated server and do not fall into this one.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.aurekai.work *.aurekai.live *.aurekai.shop *.aurekai.life
                *.theleaflounge.store;

    ssl_certificate /etc/letsencrypt/live/bonfyre-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bonfyre-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/bonfyre-public-estate.conf;
}

# These are delegated client institutions, not public Matrix territories. They
# never fall through the general public host to the legacy application. A
# current, revocable institution grant is the narrow admission point; a global
# paid tier or grant for a different client cannot open this host. The noindex
# header is deliberately applied to refusals too.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name upper90.aurekai.work jrss.aurekai.work ai-loss.aurekai.work leads.aurekai.work;

    # These client estates are wildcard subdomains. Keep them on the wildcard
    # certificate so a new protected estate cannot fail TLS before reaching
    # this no-index/auth boundary.
    ssl_certificate /etc/letsencrypt/live/bonfyre-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bonfyre-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Do not turn client paths, account numbers, report names, or bearer
    # adjacent request metadata into a second data store in the edge log.
    access_log off;
    client_max_body_size 32m;

    location = /robots.txt { return 404; }
    location ~ ^/(?:\.git|\.env|secrets)(?:/|$) { return 404; }

    location = /_bonfyre_institution {
        internal;
        proxy_pass http://127.0.0.1:8787/_bonfyre_institution;
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Bonfyre-Institution $bonfyre_institution;
        proxy_set_header X-Original-Method $request_method;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Never let a newly added generic Matrix/protocol location accidentally
    # turn a private client host into a machine-discovery endpoint.  Members
    # use the authenticated Aurekai carrier and explicit delegated tools; a
    # client hostname does not publish WebFinger, RO-Crate, Zarr, feeds, or a
    # sitemap merely because its legacy application happens to answer there.
    location ~ ^/(?:\.well-known(?:/|$)|robots\.txt$|sitemap(?:\.xml)?$|feed(?:/|$)|ro-crate(?:/|$)|zarr(?:/|$)|mcp(?:/|$)|a2a(?:/|$)|ap(?:/|$)|events(?:/|$)|ogc(?:/|$)|reso(?:/|$)|mismo(?:/|$)|beckn(?:/|$)|ucp(?:/|$)|acp(?:/|$)|mpp(?:/|$)|cap(?:/|$)|epcis(?:/|$)|wot(?:/|$)|openrtb(?:/|$)) { return 404; }

    location / {
        auth_request /_bonfyre_institution;
        error_page 401 = @bonfyre_private_signin;
        # The native delegated-estate dispatcher is the only private product
        # surface. A broad institution grant deliberately cannot fall through
        # to a legacy application that has no knowledge of the second, named
        # role/scope closure. Unknown paths stay unknown.
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Aurekai-Institution $host;
        proxy_set_header X-Bonfyre-Institution $bonfyre_institution;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $aurekai_conn;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location @bonfyre_private_signin {
        # The host is one of this server's exact delegated client names. The
        # public login validates its own next target again before returning.
        return 302 https://aurekai.work/login?next=https%3A%2F%2F$host$request_uri;
    }

}

# Future hosts get the wildcard certificate.  The inner loop is transport-only:
# it selects the exact-host server as the default SNI virtual host, preserves
# the original Host header, and therefore reaches the same native Matrix edge
# without duplicating application routes in nginx.
server {
    listen 444 ssl http2;
    listen [::]:444 ssl http2;
    server_name *.aurekai.work *.aurekai.live *.aurekai.shop *.aurekai.life *.theleaflounge.store;
    ssl_certificate /etc/letsencrypt/live/bonfyre-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bonfyre-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass https://127.0.0.1:443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name aurekai.work;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aurekai_conn;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
