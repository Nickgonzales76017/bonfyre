# Transport compression.
#
# The stock nginx.conf ships `gzip on;` with `gzip_types` left commented out, so
# nginx compresses text/html and nothing else. Everything this site actually
# ships beside HTML -- the htmx bundle, matrix.js, the surface descriptors, the
# JSON a machine reads -- went over the wire uncompressed. Measured across the
# site's static text: 8.0 MB raw, 1.6 MB gzipped, a factor of 5.
#
# This file sits in conf.d, which nginx includes inside the http block, so these
# apply to every server rather than to one host that happened to be edited.
#
# gzip_vary is not optional here: responses pass through a tunnel and a CDN, and
# a cache that stores one encoding without varying on it will hand a gzipped
# body to a client that never asked for one.
gzip_types text/plain text/css text/xml text/javascript
           application/json application/javascript application/xml
           application/xml+rss application/manifest+json
           image/svg+xml;
gzip_min_length 512;
gzip_comp_level 6;
gzip_vary on;
gzip_proxied any;
