# Deliberately thin edge carrier. Matrix/WebAddress owns host/path semantics,
# world, audience, representation, and any later Surface/API/MCP dispatch.
map $http_host $bonfyre_canonical_host {
    ~^(?<host>[a-z0-9-]+(?:\.[a-z0-9-]+)*)?(?::\d+)?$ $host;
    default "";
}

map $http_upgrade $bonfyre_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name aurekai.life *.aurekai.life aurekai.live *.aurekai.live aurekai.shop *.aurekai.shop aurekai.work *.aurekai.work theleaflounge.store *.theleaflounge.store;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aurekai.life *.aurekai.life aurekai.live *.aurekai.live aurekai.shop *.aurekai.shop aurekai.work *.aurekai.work theleaflounge.store *.theleaflounge.store;

    # TLS material is deployment-owned and intentionally not declared here.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $bonfyre_canonical_host;
        proxy_set_header X-Forwarded-Host $bonfyre_canonical_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bonfyre_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
    }
}
