# The public Matrix estate, one body, included by each certificate's server.
# nginx picks the server by SNI and therefore picks the certificate; nothing
# here knows or cares which one was chosen.

    add_header X-Aurekai-Surface $host always;
    client_max_body_size 32m;
    # The human entry point, protocol discovery, and its deliberate static
    # assets are real Matrix addresses—not redirects into a private app slice.
    location = / { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /.well-known/bonfyre { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
location = /assets/matrix.css { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
location = /assets/matrix.js { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
location = /assets/matrix-vgpu.js { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
location = /assets/matrix-htmx.js { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
location = /assets/bonfyre-surface-bridge.js { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /_surface/intake { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }

    # The external estate is a real read-only human/API surface, not a link
    # list embedded in an operator page. It exposes source-derived candidates,
    # cross-domain World compositions and explicit no-body transport probes.
    # It never proxies arbitrary provider traffic or inherits the authority of
    # this host; provider admission/effects remain native-owner decisions.
    location = /external-estate { return 308 /external-estate/; }
    location ^~ /external-estate/ {
        proxy_pass http://127.0.0.1:8792;
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /external-estate;
        add_header Cache-Control "no-store" always;
    }

    # Address-plane surfaces. The address organ decides which of these exist:
    # it serves a surface only when $SITE_ROOT/surfaces/<name>.json is present,
    # and its discovery descriptor advertises exactly the same set. Routing them
    # here means an advertised surface resolves and an unadvertised one returns
    # the organ's own 404 rather than falling through to a different backend and
    # answering with something unrelated.
    # Auth. These carry credentials, so they are exact-match only, never
    # buffered to disk, and never cached by an intermediary.
    location = /signup  { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; proxy_request_buffering off; add_header Cache-Control "no-store" always; }
    location = /login   { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; proxy_request_buffering off; add_header Cache-Control "no-store" always; }
    location = /logout  { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; add_header Cache-Control "no-store" always; }
    location = /account { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; add_header Cache-Control "no-store" always; }

    # Matrix auth owns the session; nginx merely asks the native address organ
    # for a narrow validity witness before protected projections receive it.
    location = /_bonfyre_session { internal; proxy_pass http://127.0.0.1:8787/_bonfyre_session; include proxy_params; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization;
        # auth_request always issues a GET, so the endpoint cannot see the
        # original verb. Pass it, so a mutation can be held to write scope.
        proxy_set_header X-Original-Method $request_method;
        proxy_pass_request_body off; proxy_set_header Content-Length ""; }

    # Operator surface: read-only views onto the compiled organs. Prefix match,
    # because the path selects an allowlisted row inside the organ itself.
    location ^~ /ops/ { auth_request /_bonfyre_session; error_page 401 = @studio_v1_unauthenticated; proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /ops   { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }

    location = /api/            { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /api             { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    # CMS is a real service with its own HTTP surface (schemas, entries, scoped
    # tokens, ANN search). It is proxied to BonfyreCMS on 8790, with the /cms/
    # prefix stripped so its own /v1/ routes resolve.
    # /cms/v1/ is the CMS service's own API. /cms/ is a page for a person, served
    # by the address organ. Splitting them means typing /cms/ into a browser
    # gets a studio instead of {"error":"not found"}.
    # Reads need a session; writes need write scope. auth_request always issues
    # a GET subrequest, so the endpoint cannot see the original method -- select
    # the endpoint by method instead. Without this, an account that had just
    # signed up could edit published content.
    location ^~ /cms/v1/ { auth_request /_bonfyre_session; error_page 401 = @studio_v1_unauthenticated; proxy_pass http://127.0.0.1:8790/v1/; include proxy_params; proxy_set_header Host $host; }
    location = /_bonfyre_write { internal; proxy_pass http://127.0.0.1:8787/_bonfyre_write; include proxy_params;
        proxy_set_header Host $host; proxy_set_header Authorization $http_authorization;
        proxy_pass_request_body off; proxy_set_header Content-Length ""; }
    location = /cms/     { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /cms      { return 308 /cms/; }
    # Crawl policy.
    #
    # There was no robots.txt at all, so every operational surface was fair game
    # for any well-behaved crawler, and the desk links onward to rooms and
    # subjects. robots.txt is advisory and stops nothing malicious; the
    # X-Robots-Tag below is the part search engines actually honour for pages
    # they have already fetched.
    location = /robots.txt {
        add_header Content-Type text/plain always;
        return 200 "Sitemap: https://aurekai.life/sitemap.xml\n\nUser-agent: *\nAllow: /protocols\nAllow: /notes/\nDisallow: /studio/\nDisallow: /room/\nDisallow: /s/\nDisallow: /flow\nDisallow: /lens\nDisallow: /make\nDisallow: /cms/\nDisallow: /account\nDisallow: /ops/\nDisallow: /assets/twin/\nDisallow: /mcp\nDisallow: /studio/v1/\n";
    }

    location = /studio/ { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /studio { return 308 /studio/; }
    # The full operator panel keeps its address; the desk at /studio/ is the front door.
    location = /studio/controls { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /studio/v1/ { auth_request /_bonfyre_session; error_page 401 = @studio_v1_unauthenticated; proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    # Published CMS pages resolve at their own route. The address organ
    # serves a page only when it is published AND guest-readable, so this
    # prefix cannot expose an unpublished or session-gated record.
    # x402 machine edge. Discovery is public; each capability answers 402
    # until a payment is presented and verified. X-PAYMENT must reach the
    # organ intact, and 402 responses are never cached by an intermediary.
    location ^~ /capability     { proxy_pass http://127.0.0.1:8787; include proxy_params;
                                  proxy_set_header Host $host;
                                  proxy_set_header X-PAYMENT $http_x_payment;
                                  add_header Cache-Control "no-store" always; }
    # Protocol projections: one semantic Matrix, many carrier grammars.
    location ^~ /protocols                    { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /.well-known/agent.json        { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /.well-known/webfinger         { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /ap/                          { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /events                       { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /ogc                          { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /reso/                        { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /mismo/                       { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /beckn/                       { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /ucp/                         { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /acp/                         { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /mpp/                         { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /cap/                         { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /epcis/                       { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /wot/                         { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /openrtb/                     { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /discover { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /board { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /community { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /listings { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /parcels { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /inbox { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /channels { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /territory       { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /market           { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /sources          { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /agents           { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /lens             { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; add_header X-Robots-Tag "noindex, nofollow" always; }
    location ^~ /room/            { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; add_header X-Robots-Tag "noindex, nofollow" always; }
    location ^~ /make             { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; add_header X-Robots-Tag "noindex, nofollow" always; }
    location ^~ /surfaces         { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /flow             { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; add_header X-Robots-Tag "noindex, nofollow" always; }
    # WebSub callbacks. The hub GETs to verify and POSTs to notify, so both verbs
    # reach the organ. No auth_request: the hub is a stranger by design and proves
    # itself with a per-subscription HMAC rather than a session.
    location = /membrane { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /membrane/ { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /websub/ { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; add_header X-Robots-Tag "noindex, nofollow" always; }
    # Subjects address themselves: /s/<kind>/<id> renders the object and the
    # actions computed for whoever is asking.
    location ^~ /s/ { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; add_header X-Robots-Tag "noindex, nofollow" always; }
    # One intent carried through: search, parcel, market, act.
    location ^~ /property { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location ^~ /notes/         { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /habitat/        { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /habitat         { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /a2a/resources/  { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /a2a/resources   { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /mcp/resources/  { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location = /mcp/resources   { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }

    # The auth boundary must answer in the caller's grammar.
    #
    # auth_request failing makes nginx serve its own default page, and the
    # organ never sees the request -- so a machine asking /studio/v1 for JSON
    # received 188 bytes of HTML with content-type text/html. The estate's
    # claim is that a person and a machine reach the same capability through
    # two lawful carriers; handing machines an HTML page at the one boundary
    # every unauthenticated caller meets is that claim failing where it is
    # least visible.
    location @studio_v1_unauthenticated {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"error":"session_required","note":"this is an authenticated API surface; sign in at /login and present the session as a bearer token"}';
    }

    # Aperture and surface routes answer for themselves, including their 404s.
    #
    # The fallthrough below treats a 404 as "the Matrix does not know this
    # address" and hands the request to legacy software. That is right for an
    # unbound address and wrong for these: an aperture replying that no
    # ObjectContract declares an operation is a precise answer, and routing it
    # onward replaced it with a generic not_found. The organ had already said
    # something useful and the reader never saw it.
    location /_aperture { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }
    location /_surface  { proxy_pass http://127.0.0.1:8787; include proxy_params; proxy_set_header Host $host; }

    # The Matrix receives ordinary semantic paths first.  A true Matrix miss
    # (404) is the only condition that falls through to established native
    # software, so a newly bound subject becomes reachable at its web address
    # without a hand-maintained per-slug nginx rule.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_intercept_errors on;
        error_page 404 = @bonfyre_legacy_surface;
        include proxy_params;
        proxy_set_header Host $host;
    }

    # Existing normal software stays reachable on the same origin after the
    # Matrix has honestly declined an unbound address.
    location @bonfyre_legacy_surface {
        proxy_pass http://127.0.0.1:3045;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Aurekai-Public  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $aurekai_conn;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # OAuth is the public authority boundary for the existing project MCP. The
    # bridge authenticates a BonfyreAuth session and only then forwards to the
    # native owner with its internal credential; Nginx preserves paths only.
    location = /.well-known/oauth-authorization-server { proxy_pass http://127.0.0.1:8791; include proxy_params; proxy_set_header Host $host; }
    location = /.well-known/openid-configuration { proxy_pass http://127.0.0.1:8791; include proxy_params; proxy_set_header Host $host; }
    location = /.well-known/oauth-protected-resource/mcp { proxy_pass http://127.0.0.1:8791; include proxy_params; proxy_set_header Host $host; }
    location = /auth.md { proxy_pass http://127.0.0.1:8791; include proxy_params; proxy_set_header Host $host; add_header Cache-Control "no-store" always; }
    location = /oauth/authorize { proxy_pass http://127.0.0.1:8791; include proxy_params; proxy_set_header Host $host; proxy_request_buffering off; add_header Cache-Control "no-store" always; }
    location = /oauth/token { proxy_pass http://127.0.0.1:8791; include proxy_params; proxy_set_header Host $host; proxy_request_buffering off; add_header Cache-Control "no-store" always; }
    location = /mcp {
        proxy_pass http://127.0.0.1:8791/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
