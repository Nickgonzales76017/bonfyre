<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Financial review</title><style>
:root{color-scheme:light;--ink:#18342a;--border:#d4dfd7;--paper:#fff;--wash:#f3f7f4}*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui}button,input,select{font:inherit;min-height:40px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--paper);color:inherit}button{cursor:pointer;font-weight:600}button:disabled{opacity:.5;cursor:default}button.primary{background:#22634a;color:#fff;border-color:#22634a}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #88afed;outline-offset:2px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 8px}p{margin:8px 0}header,.toolbar,.bulk,footer,.preview-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:16px}header small{display:block;color:#5d6d64}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:8px;background:var(--wash);margin-bottom:16px}.metrics div{padding:12px 16px}.metrics strong{font-size:26px;display:block}.metrics span{font-size:12px}.toolbar{justify-content:space-between}.bulk{margin:12px 0}.bulk input{flex:1;min-width:140px}.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.stage:has(aside:not([hidden])){grid-template-columns:minmax(0,1fr) 300px}.grid{height:370px;min-width:0}aside,.preview,.mapping-form{border:1px solid var(--border);border-radius:8px;padding:16px;overflow-wrap:anywhere}aside p{font-size:12px;color:#53645a}label{display:grid;gap:4px;margin:10px 0}input{min-width:0;max-width:100%}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;overflow-wrap:anywhere}th{font-weight:600}.preview{margin-top:16px;background:var(--wash)}.preview-scroll{max-height:280px;overflow:auto}.preview-actions{justify-content:flex-end;margin-top:12px}.mapping-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}.mapping-form{margin:12px 0}.recovery{padding:12px;background:#fff1d6;border:1px solid #d4a447;border-radius:6px;overflow-wrap:anywhere}footer{justify-content:space-between;margin-top:12px}.status{min-height:21px;color:#8a381f}[hidden]{display:none!important}@media(max-width:800px){body{padding:12px}.stage:has(aside:not([hidden])){grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.mapping-fields{grid-template-columns:repeat(2,1fr)}.bulk button{flex:1}.grid{height:340px}}
</style></head><body>
<header><div><h1 data-title>Financial review</h1><small data-revision>Waiting for a saved workbook</small></div><button data-editor disabled>Open workbook</button></header>
<div class="metrics" data-metrics aria-label="Review totals"></div>
<p class="recovery" data-recovery role="alert" hidden></p><p data-calculation class="status" role="alert"></p>
<div class="toolbar"><select data-filter aria-label="Transaction status"><option value="all">All transactions</option><option value="pending">Needs review</option><option value="reviewed">Reviewed</option><option value="duplicates">Possible duplicates</option></select><div><button data-mapping>Columns</button> <button data-reload disabled>Reload saved</button></div></div>
<form class="mapping-form" data-mapping-form hidden></form>
<div class="bulk"><strong data-selected>0 selected</strong><input data-note aria-label="Review note" placeholder="Review note" maxlength="1000"><button data-review>Preview review</button><button data-reopen>Preview reopen</button></div>
<div class="stage"><div class="grid" data-grid aria-label="Transactions"></div><aside data-inspector aria-label="Transaction details" hidden></aside></div>
<footer><span data-page></span><div><button data-previous>Previous</button> <button data-next>Next</button></div></footer>
<section class="preview" data-preview aria-label="Changes to save" hidden><h2>Review changes</h2><p data-preview-summary></p><div class="preview-scroll"><table><thead><tr><th>Cell or decision</th><th>Before or action</th><th>After or note</th></tr></thead><tbody data-changes></tbody></table></div><p>Review marks are annotations. Saving does not approve or post transactions.</p><div class="preview-actions"><button data-discard>Discard preview</button><button data-save class="primary">Save these changes</button></div></section>
<p class="status" data-status role="status" aria-live="polite">Connecting to the host…</p>
<!-- WORKBOOK_APP_SCRIPTS -->
</body></html>
