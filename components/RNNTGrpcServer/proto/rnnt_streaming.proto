syntax = "proto3";

package bonfyre.rnnt;

message AudioChunk {
  string stream_id = 1;
  bytes audio = 2;
  int32 sample_rate = 3;
  bool is_final_chunk = 4;
}

message TranscriptUpdate {
  string stream_id = 1;
  string text = 2;
  bool is_final = 3;
  double confidence = 4;
}

service RnntStreaming {
  rpc StreamRecognize (stream AudioChunk) returns (stream TranscriptUpdate);
}
