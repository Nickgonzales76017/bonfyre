# Native owner-backed MCP gateway at :3052. No Python base dependency.

[Service]
LoadCredential=mcp-token:/etc/bonfyre/mcp.token
Environment=BONFYRE_MCP_TOKEN_FILE=%d/mcp-token
Environment=BONFYRE_RECURSIVE_REGISTRY_JSON=/opt/bonfyre/integrations/mcp/recursive_overlay.registry.json
Environment=BONFYRE_MATRIX_DB=/var/lib/bonfyre/matrix.db
Environment=BONFYRE_WEB_ADDRESS_BINARY=/usr/local/bin/bonfyre-web-address
ExecStart=
ExecStart=/home/ubuntu/.bun/bin/bun /opt/bonfyre/integrations/mcp/recursive_overlay.mjs

# Installation requires daemon-reload + restart + descriptor, resource,
# prompt, auxiliary HTTP and authority-gate smoke with the old base stopped.
